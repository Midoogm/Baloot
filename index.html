<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    <link rel="apple-touch-icon" href="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/2660.png">
    
    <title>Baloot Pro - بلوت برو</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap');
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #0f172a;
            background: radial-gradient(circle at top, #1e293b, #020617);
            color: #f8fafc;
            height: 100dvh; 
            margin: 0;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            overflow: hidden; /* Zero Scroll */
        }
        .btn-press { transition: transform 0.1s ease, opacity 0.2s ease, box-shadow 0.2s ease; }
        .btn-press:active { transform: scale(0.96); }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        
        .chip { transition: all 0.2s ease; position: relative; }
        .chip.active {
            background-color: #3b82f6;
            color: white;
            border-color: #3b82f6;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.4);
        }
        .badge {
            position: absolute; top: -5px; right: -5px;
            background: #e11d48; color: white;
            border-radius: 50%; width: 16px; height: 16px;
            font-size: 9px; font-weight: 900;
            display: flex; align-items: center; justify-content: center;
            border: 2px solid #0f172a;
        }
        
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const SakahLimit = 152;
        
        const PROJECT_DEF = [
            { key: 'sira', label: 'سرا' }, { key: 'fifty', label: 'خمسين' },
            { key: 'hundred', label: 'مية' }, { key: 'fourHundred', label: 'اربعمية' }, { key: 'baloot', label: 'بلوت' }
        ];

        const DEFAULT_NUMBERS = {
            "صفر":0,"زيرو":0,"واحد":1,"اثنين":2,"ثنين":2,"اتنين":2,"تلاته":3,"ثلاثه":3,"ثلاثة":3,
            "اربع":4,"اربعة":4,"اربعه":4,"خمس":5,"خمسه":5,"خمسة":5,"ست":6,"سته":6,"ستة":6,"سبع":7,"سبعه":7,"سبعة":7,
            "ثمان":8,"تمان":8,"ثمانيه":8,"ثمانية":8,"تسع":9,"تسعه":9,"تسعة":9,"عشر":10,"عشره":10,"عشرة":10,
            "احداعش":11,"ايداعش":11,"حديعش":11,"اثنعش":12,"اطعش":12,"تلطعش":13,"ثلاثطعش":13,"اربعطعش":14,
            "خمسطعش":15,"سطعش":16,"ستطعش":16,"سبعطعش":17,"ثمنطعش":18,"ثمانطعش":18,"تسعطعش":19,"عشرين":20,
            "واحد وعشرين":21,"اثنين وعشرين":22,"ثنين وعشرين":22,"ثلاثه وعشرين":23,"اربعة وعشرين":24,"خمسة وعشرين":25,"ستة وعشرين":26
        };

        const DEFAULT_TARGETS = {
            "لنا": "lana", "إحنا": "lana", "نحن": "lana", "حنا": "lana", "معنا": "lana", "حقنا": "lana", "النا": "lana",
            "لهم": "lahoma", "هم": "lahoma", "خصم": "lahoma", "ضدهم": "lahoma", "هما": "lahoma", "الهم": "lahoma", "معهم": "lahoma"
        };

        const App = () => {
            const [history, setHistory] = useState([]);
            const [calcMode, setCalcMode] = useState('strict'); // 'strict' | 'free'
            const [ttsEnabled, setTtsEnabled] = useState(false);
            const [editingId, setEditingId] = useState(null);
            const [isDictModalOpen, setIsDictModalOpen] = useState(false);
            
            const blankForm = {
                type: 'sun', buyer: 'lana',
                projects: { lana: { sira: 0, fifty: 0, hundred: 0, fourHundred: 0, baloot: 0 }, lahoma: { sira: 0, fifty: 0, hundred: 0, fourHundred: 0, baloot: 0 } },
                pointsLana: '', pointsLahoma: ''
            };
            const [form, setForm] = useState(blankForm);

            const [customDict, setCustomDict] = useState({ numbers: {}, targets: {} });
            const [newWord, setNewWord] = useState('');
            const [newMeaningType, setNewMeaningType] = useState('number');
            const [newMeaningVal, setNewMeaningVal] = useState('');

            const [isListening, setIsListening] = useState(false);
            const [transcriptLog, setTranscriptLog] = useState("");
            const [voiceFeedback, setVoiceFeedback] = useState("");
            
            const recognitionRef = useRef(null);

            // Persistence
            useEffect(() => {
                const saved = localStorage.getItem('balootProHistoryV9');
                if (saved) try { setHistory(JSON.parse(saved)); } catch (e) {}
                const savedDict = localStorage.getItem('balootProDictV3');
                if (savedDict) try { setCustomDict(JSON.parse(savedDict)); } catch (e) {}
                const savedMode = localStorage.getItem('balootProMode');
                if (savedMode) setCalcMode(savedMode);
                const savedTTS = localStorage.getItem('balootProTTS');
                if (savedTTS) setTtsEnabled(savedTTS === 'true');
            }, []);

            useEffect(() => { localStorage.setItem('balootProHistoryV9', JSON.stringify(history)); }, [history]);
            useEffect(() => { localStorage.setItem('balootProDictV3', JSON.stringify(customDict)); }, [customDict]);
            useEffect(() => { localStorage.setItem('balootProMode', calcMode); }, [calcMode]);
            useEffect(() => { localStorage.setItem('balootProTTS', ttsEnabled.toString()); }, [ttsEnabled]);

            // TTS Announcer
            const announceScore = (lana, lahoma, customMsg = null) => {
                if (!ttsEnabled) return;
                window.speechSynthesis.cancel();
                let text = customMsg ? customMsg : `النتيجة الآن، لنا ${lana}، ولهم ${lahoma}.`;
                let u = new SpeechSynthesisUtterance(text);
                u.lang = 'ar-SA'; u.rate = 1.05;
                window.speechSynthesis.speak(u);
            };

            // Voice Recognition Setup
            useEffect(() => {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (SpeechRecognition) {
                    const recognition = new SpeechRecognition();
                    recognition.continuous = false; recognition.interimResults = false; recognition.lang = 'ar-SA'; 
                    
                    recognition.onstart = () => {
                        setIsListening(true);
                        setVoiceFeedback("أستمع... (مثال: 'معنا 15')");
                    };
                    
                    recognition.onresult = (event) => {
                        const transcript = event.results[0][0].transcript;
                        setTranscriptLog(transcript);
                        processPointsTranscript(transcript);
                    };
                    
                    recognition.onerror = () => { setVoiceFeedback("❌ لم أسمع بوضوح."); setIsListening(false); };
                    recognition.onend = () => setIsListening(false);
                    recognitionRef.current = recognition;
                }
            }, [form, customDict, calcMode]);

            const processPointsTranscript = (transcript) => {
                let text = transcript.replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).toLowerCase();
                const mergedNums = { ...DEFAULT_NUMBERS, ...customDict.numbers };
                const mergedTargets = { ...DEFAULT_TARGETS, ...customDict.targets };

                let foundNum = null; let foundTarget = null;
                const digitMatch = text.match(/\d+/);
                if (digitMatch) foundNum = parseInt(digitMatch[0], 10);

                if (foundNum === null) {
                    const sortedWords = Object.keys(mergedNums).sort((a, b) => b.length - a.length);
                    for (const word of sortedWords) { if (text.includes(word)) { foundNum = mergedNums[word]; break; } }
                }
                
                const sortedTargets = Object.keys(mergedTargets).sort((a, b) => b.length - a.length);
                for (const word of sortedTargets) { if (text.includes(word)) { foundTarget = mergedTargets[word]; break; } }

                if (foundNum !== null) {
                    const max = form.type === 'sun' ? 26 : 16;
                    if (calcMode === 'strict' && foundNum > max) {
                        setVoiceFeedback(`❌ الرقم ${foundNum} يتجاوز الحد (${max})`);
                        return;
                    }

                    const targetTeam = foundTarget || form.buyer; 
                    setForm(prev => {
                        let updates = { ...prev };
                        if (targetTeam === 'lana') {
                            updates.pointsLana = foundNum;
                            if(calcMode === 'strict') updates.pointsLahoma = max - foundNum;
                        } else {
                            updates.pointsLahoma = foundNum;
                            if(calcMode === 'strict') updates.pointsLana = max - foundNum;
                        }
                        return updates;
                    });
                    setVoiceFeedback(`✅ تم تسجيل ${foundNum} لـ ${targetTeam === 'lana' ? 'لنا' : 'لهم'}`);
                } else {
                    setVoiceFeedback("❌ لم التقط الأبناط.");
                }
            };

            const toggleListening = () => {
                if (!recognitionRef.current) return alert("المتصفح لا يدعم الصوت.");
                if (isListening) recognitionRef.current.stop();
                else { setTranscriptLog(""); recognitionRef.current.start(); }
            };

            // Smart Calculator Input Logic
            const handlePointsChange = (team, value) => {
                let valStr = value.replace(/^0+/, ''); 
                if (valStr === '') { setForm(prev => ({ ...prev, [team === 'lana' ? 'pointsLana' : 'pointsLahoma']: '' })); return; }
                
                let val = parseInt(valStr, 10);
                if (isNaN(val)) return;

                if (calcMode === 'strict') {
                    const max = form.type === 'sun' ? 26 : 16;
                    if (val > max) val = parseInt(valStr.slice(-1), 10); // Assume they typed a new digit
                    
                    if (team === 'lana') setForm(prev => ({ ...prev, pointsLana: val, pointsLahoma: max - val }));
                    else setForm(prev => ({ ...prev, pointsLahoma: val, pointsLana: max - val }));
                } else {
                    // Free Mode: No rules
                    if (team === 'lana') setForm(prev => ({ ...prev, pointsLana: val }));
                    else setForm(prev => ({ ...prev, pointsLahoma: val }));
                }
            };

            const handleProjectClick = (team, projKey) => {
                setForm(prev => {
                    const newProjects = { ...prev.projects };
                    newProjects[team] = { ...newProjects[team] };
                    newProjects[team][projKey] += 1;
                    return { ...prev, projects: newProjects };
                });
            };

            const clearProjects = (team) => {
                setForm(prev => {
                    const newProjects = { ...prev.projects };
                    newProjects[team] = { sira: 0, fifty: 0, hundred: 0, fourHundred: 0, baloot: 0 };
                    return { ...prev, projects: newProjects };
                });
            };

            const calculateProjectPoints = (team, type) => {
                const p = form.projects[team];
                let total = 0;
                if (type === 'sun') {
                    total += p.sira * 4; total += p.fifty * 10; total += p.hundred * 20; total += p.fourHundred * 40;
                } else {
                    total += p.sira * 2; total += p.fifty * 5; total += p.hundred * 10; total += p.baloot * 2;
                }
                return total;
            };

            const calculateResults = () => {
                let baseLana = parseInt(form.pointsLana) || 0;
                let baseLahoma = parseInt(form.pointsLahoma) || 0;
                let pLana = calculateProjectPoints('lana', form.type);
                let pLahoma = calculateProjectPoints('lahoma', form.type);
                
                let totLana = 0, totLahoma = 0, isLoss = false, lossMessage = "", ready = false;

                if (calcMode === 'free') {
                    totLana = baseLana + pLana;
                    totLahoma = baseLahoma + pLahoma;
                    ready = form.pointsLana !== '' && form.pointsLahoma !== '';
                } else {
                    // Strict Mode with official rules
                    let maxPts = form.type === 'sun' ? 26 : 16;
                    let kabootPts = form.type === 'sun' ? 44 : 26;
                    ready = (baseLana + baseLahoma === maxPts);

                    if (ready) {
                        if (baseLana === maxPts) {
                            totLana = kabootPts + pLana + pLahoma; totLahoma = 0; lossMessage = "كبوت لنا! 🔥";
                        } else if (baseLahoma === maxPts) {
                            totLahoma = kabootPts + pLana + pLahoma; totLana = 0; lossMessage = "كبوت لهم! 💀";
                        } else {
                            let rawLana = baseLana + pLana; let rawLahoma = baseLahoma + pLahoma;
                            // Check loss (If buyer ties or scores less, defender takes ALL points + ALL projects)
                            if (form.buyer === 'lana' && rawLana <= rawLahoma) {
                                isLoss = true; totLahoma = maxPts + pLana + pLahoma; totLana = 0; lossMessage = "خسارة علينا! 💔";
                            } else if (form.buyer === 'lahoma' && rawLahoma <= rawLana) {
                                isLoss = true; totLana = maxPts + pLana + pLahoma; totLahoma = 0; lossMessage = "خسارة عليهم! 🏆";
                            } else {
                                totLana = rawLana; totLahoma = rawLahoma;
                            }
                        }
                    }
                }
                return { totLana, totLahoma, isLoss, lossMessage, ready };
            };

            const submitRound = () => {
                const results = calculateResults();
                if (!results.ready) return;
                
                const newRound = {
                    id: editingId || Date.now(),
                    lana: results.totLana,
                    lahoma: results.totLahoma,
                    details: calcMode === 'strict' ? (form.type === 'sun' ? 'صن' : 'حكم') : 'حر',
                    snapshot: JSON.parse(JSON.stringify({ ...form, calcMode })) // Save raw state for editing
                };

                let updatedHistory;
                if (editingId) {
                    updatedHistory = history.map(r => r.id === editingId ? newRound : r);
                    setEditingId(null);
                } else {
                    updatedHistory = [newRound, ...history];
                }
                
                setHistory(updatedHistory);
                setForm(blankForm);
                setTranscriptLog(""); setVoiceFeedback("");

                // Speak after round
                const finalLana = updatedHistory.reduce((acc, curr) => acc + curr.lana, 0);
                const finalLahoma = updatedHistory.reduce((acc, curr) => acc + curr.lahoma, 0);
                announceScore(finalLana, finalLahoma, results.lossMessage ? `${results.lossMessage}. النتيجة الآن، لنا ${finalLana}، ولهم ${finalLahoma}.` : null);
            };

            const editRound = (round) => {
                setEditingId(round.id);
                setCalcMode(round.snapshot.calcMode || 'strict');
                setForm(round.snapshot);
            };

            const cancelEdit = () => { setEditingId(null); setForm(blankForm); };
            const resetGame = () => { if (window.confirm("تصفير النتيجة؟")) { setHistory([]); setEditingId(null); setForm(blankForm); } };

            // Dict Handlers
            const handleAddWord = () => {
                if (!newWord.trim() || newMeaningVal === '') return;
                setCustomDict(prev => {
                    const d = { ...prev };
                    if (newMeaningType === 'number') d.numbers = { ...d.numbers, [newWord.toLowerCase()]: parseInt(newMeaningVal, 10) };
                    else d.targets = { ...d.targets, [newWord.toLowerCase()]: newMeaningVal };
                    return d;
                });
                setNewWord(''); setNewMeaningVal('');
            };
            const handleRemoveWord = (type, word) => {
                setCustomDict(prev => { const d = { ...prev }; delete d[type][word]; return d; });
            };

            const totalLana = history.reduce((acc, curr) => acc + curr.lana, 0);
            const totalLahoma = history.reduce((acc, curr) => acc + curr.lahoma, 0);
            const preview = calculateResults();

            return (
                <div className="w-full max-w-md mx-auto h-[100dvh] flex flex-col overflow-hidden bg-[#0f172a]">
                    
                    {/* Compact Header & Toggles */}
                    <div className="px-3 pt-4 pb-2 shrink-0 flex flex-col z-10 gap-2 border-b border-slate-800">
                        <div className="flex justify-between items-center">
                            <div className="flex gap-2">
                                <button onClick={() => setCalcMode(prev => prev === 'strict' ? 'free' : 'strict')} 
                                    className={`px-2 py-1 rounded text-xs font-bold transition btn-press border ${calcMode === 'strict' ? 'bg-indigo-900/50 text-indigo-300 border-indigo-700/50' : 'bg-amber-900/50 text-amber-300 border-amber-700/50'}`}>
                                    <i className={`fa-solid ${calcMode === 'strict' ? 'fa-brain' : 'fa-unlock'} mr-1`}></i>
                                    {calcMode === 'strict' ? 'حاسبة ذكية' : 'حاسبة حرة'}
                                </button>
                                <button onClick={() => setTtsEnabled(!ttsEnabled)} 
                                    className={`w-8 h-8 rounded-full flex items-center justify-center transition btn-press border ${ttsEnabled ? 'bg-emerald-900/50 text-emerald-400 border-emerald-700/50' : 'bg-slate-800 text-slate-500 border-slate-700'}`}>
                                    <i className={`fa-solid ${ttsEnabled ? 'fa-volume-high' : 'fa-volume-xmark'}`}></i>
                                </button>
                            </div>
                            
                            <h1 className="text-xl font-black tracking-wider gold-text m-0">بلوت برو</h1>
                            
                            <div className="flex gap-2">
                                <button onClick={() => setIsDictModalOpen(true)} className="w-8 h-8 text-blue-400 bg-blue-900/30 rounded-full flex items-center justify-center transition btn-press">
                                    <i className="fa-solid fa-book"></i>
                                </button>
                                <button onClick={resetGame} className="w-8 h-8 text-rose-400 bg-rose-900/30 rounded-full flex items-center justify-center transition btn-press">
                                    <i className="fa-solid fa-rotate-right"></i>
                                </button>
                            </div>
                        </div>
                        
                        {/* Progress */}
                        <div className="w-full bg-slate-800/80 rounded-full h-1 flex overflow-hidden">
                            <div className="bg-emerald-500 h-full progress-bar" style={{width: `${Math.min((totalLana/SakahLimit)*100, 100)}%`}}></div>
                            <div className="flex-1"></div>
                            <div className="bg-rose-500 h-full progress-bar" style={{width: `${Math.min((totalLahoma/SakahLimit)*100, 100)}%`}}></div>
                        </div>
                    </div>

                    {/* Compact Scoreboard */}
                    <div className="px-3 py-2 shrink-0 z-10 flex justify-between items-center bg-slate-900/50 border-b border-slate-800/80 shadow-sm">
                        <div className="flex flex-col items-center flex-1">
                            <span className="text-[10px] font-bold text-slate-500">لنا (Us)</span>
                            <span className="text-3xl font-black text-emerald-400">{totalLana}</span>
                        </div>
                        
                        <button onClick={() => announceScore(totalLana, totalLahoma)} className="w-10 h-10 bg-slate-800 text-slate-400 rounded-full flex flex-col items-center justify-center shadow-inner btn-press hover:text-white">
                            <i className="fa-solid fa-bullhorn text-sm"></i>
                        </button>
                        
                        <div className="flex flex-col items-center flex-1">
                            <span className="text-[10px] font-bold text-slate-500">لهم (Them)</span>
                            <span className="text-3xl font-black text-rose-400">{totalLahoma}</span>
                        </div>
                    </div>

                    {/* MAIN IN-PLACE ENTRY FORM (Always Visible) */}
                    <div className="shrink-0 p-3 bg-slate-950/80 border-b border-slate-800 flex flex-col gap-3 relative shadow-[0_5px_15px_rgba(0,0,0,0.5)] z-20">
                        {editingId && (
                            <div className="absolute top-0 left-0 w-full h-1 bg-yellow-500 animate-pulse"></div>
                        )}
                        
                        {/* Projects Compact Row */}
                        <div className="flex flex-col gap-1.5">
                            <div className="flex items-center justify-between">
                                <span className="text-[10px] font-bold text-slate-500 bg-slate-900 px-2 py-0.5 rounded border border-slate-800">لنا:</span>
                                <div className="flex flex-wrap gap-1 flex-1 justify-end">
                                    {PROJECT_DEF.map(p => (
                                        <button key={'lana'+p.key} onClick={() => handleProjectClick('lana', p.key)} 
                                            className={`chip px-2 py-1 rounded text-[10px] font-bold border border-slate-700 ${form.projects.lana[p.key] > 0 ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-400'}`}>
                                            {p.label} {form.projects.lana[p.key] > 0 && <span className="badge">{form.projects.lana[p.key]}</span>}
                                        </button>
                                    ))}
                                    {Object.values(form.projects.lana).some(v=>v>0) && <button onClick={()=>clearProjects('lana')} className="px-2 py-1 rounded text-[10px] bg-rose-900/50 text-rose-400"><i className="fa-solid fa-xmark"></i></button>}
                                </div>
                            </div>
                            <div className="flex items-center justify-between">
                                <span className="text-[10px] font-bold text-slate-500 bg-slate-900 px-2 py-0.5 rounded border border-slate-800">لهم:</span>
                                <div className="flex flex-wrap gap-1 flex-1 justify-end">
                                    {PROJECT_DEF.map(p => (
                                        <button key={'lahoma'+p.key} onClick={() => handleProjectClick('lahoma', p.key)} 
                                            className={`chip px-2 py-1 rounded text-[10px] font-bold border border-slate-700 ${form.projects.lahoma[p.key] > 0 ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-400'}`}>
                                            {p.label} {form.projects.lahoma[p.key] > 0 && <span className="badge">{form.projects.lahoma[p.key]}</span>}
                                        </button>
                                    ))}
                                    {Object.values(form.projects.lahoma).some(v=>v>0) && <button onClick={()=>clearProjects('lahoma')} className="px-2 py-1 rounded text-[10px] bg-rose-900/50 text-rose-400"><i className="fa-solid fa-xmark"></i></button>}
                                </div>
                            </div>
                        </div>

                        {/* Type & Buyer (Only highly relevant if strict, but kept for logic) */}
                        {calcMode === 'strict' && (
                            <div className="grid grid-cols-2 gap-2">
                                <div className="flex bg-slate-900 rounded p-1 border border-slate-800">
                                    <button onClick={() => handleTypeChange('sun')} className={`flex-1 py-1 rounded font-bold text-xs transition ${form.type === 'sun' ? 'bg-indigo-600 text-white' : 'text-slate-500'}`}>صن</button>
                                    <button onClick={() => handleTypeChange('hokom')} className={`flex-1 py-1 rounded font-bold text-xs transition ${form.type === 'hokom' ? 'bg-indigo-600 text-white' : 'text-slate-500'}`}>حكم</button>
                                </div>
                                <div className="flex bg-slate-900 rounded p-1 border border-slate-800">
                                    <button onClick={() => setForm({...form, buyer: 'lana'})} className={`flex-1 py-1 rounded font-bold text-xs transition ${form.buyer === 'lana' ? 'bg-emerald-600 text-white' : 'text-slate-500'}`}>المشتري لنا</button>
                                    <button onClick={() => setForm({...form, buyer: 'lahoma'})} className={`flex-1 py-1 rounded font-bold text-xs transition ${form.buyer === 'lahoma' ? 'bg-rose-600 text-white' : 'text-slate-500'}`}>المشتري لهم</button>
                                </div>
                            </div>
                        )}

                        {/* Points & Submit Row */}
                        <div className="flex gap-2 items-stretch h-14">
                            <input type="number" value={form.pointsLana} onChange={(e) => handlePointsChange('lana', e.target.value)} onFocus={(e) => e.target.select()}
                                className="w-16 bg-slate-900 border border-emerald-900/50 rounded-lg text-center text-xl font-black text-white focus:outline-none focus:border-emerald-500 focus:bg-slate-800 transition" placeholder="لنا" />
                            
                            <button onClick={toggleListening} className={`w-14 rounded-lg flex items-center justify-center text-lg transition-all btn-press border border-slate-700 shrink-0
                                ${isListening ? 'bg-rose-600 text-white shadow-[0_0_15px_#e11d48] border-rose-400 animate-pulse' : 'bg-slate-800 text-blue-400 hover:bg-blue-600 hover:text-white'}`}>
                                <i className={`fa-solid ${isListening ? 'fa-stop' : 'fa-microphone'}`}></i>
                            </button>

                            <input type="number" value={form.pointsLahoma} onChange={(e) => handlePointsChange('lahoma', e.target.value)} onFocus={(e) => e.target.select()}
                                className="w-16 bg-slate-900 border border-rose-900/50 rounded-lg text-center text-xl font-black text-white focus:outline-none focus:border-rose-500 focus:bg-slate-800 transition" placeholder="لهم" />
                            
                            <button onClick={submitRound} disabled={!preview.ready} 
                                className={`flex-1 rounded-lg font-bold text-sm transition-all btn-press flex flex-col items-center justify-center leading-tight
                                ${preview.ready ? (editingId ? 'bg-yellow-600 text-white' : 'bg-emerald-600 text-white shadow-[0_0_10px_rgba(16,185,129,0.3)]') : 'bg-slate-800 text-slate-600'}`}>
                                {editingId ? <span>تحديث<br/>الجولة</span> : <span>تسجيل<br/>النتيجة</span>}
                            </button>
                            
                            {editingId && (
                                <button onClick={cancelEdit} className="w-10 rounded-lg bg-slate-800 text-slate-400 hover:text-white transition btn-press flex items-center justify-center">
                                    <i className="fa-solid fa-xmark"></i>
                                </button>
                            )}
                        </div>

                        {/* Live Preview / Status */}
                        {(preview.ready || transcriptLog || voiceFeedback) && (
                            <div className="flex justify-between items-center text-[10px] font-bold px-1">
                                <div className="text-slate-400">
                                    {transcriptLog && <span>سمعت: <span className="text-emerald-400">"{transcriptLog}"</span> </span>}
                                    {voiceFeedback && <span className={voiceFeedback.includes('✅') ? 'text-blue-400' : 'text-rose-400'}>{voiceFeedback}</span>}
                                </div>
                                {preview.ready && (
                                    <div className="flex gap-2 items-center">
                                        {preview.lossMessage && <span className="text-rose-400 animate-pulse">{preview.lossMessage}</span>}
                                        <span className="bg-slate-800 px-2 py-0.5 rounded border border-slate-700 text-slate-300">
                                            المجموع: <span className="text-emerald-400">{preview.totLana}</span> - <span className="text-rose-400">{preview.totLahoma}</span>
                                        </span>
                                    </div>
                                )}
                            </div>
                        )}
                    </div>

                    {/* Scrollable Ledger */}
                    <div className="flex-1 overflow-y-auto bg-slate-900/50">
                        <div className="grid grid-cols-4 text-center bg-slate-950 p-2 font-bold text-slate-500 text-[10px] border-b border-slate-800 sticky top-0 z-10">
                            <div>لنا</div><div>النوع</div><div>الفرق</div><div>لهم</div>
                        </div>
                        {history.length === 0 ? (
                            <div className="h-full flex flex-col items-center justify-center text-slate-600 space-y-2 opacity-50 pb-10">
                                <i className="fa-solid fa-spade text-3xl"></i>
                                <span className="text-xs">السجل فارغ</span>
                            </div>
                        ) : (
                            history.map((round) => (
                                <div key={round.id} onClick={() => editRound(round)} 
                                    className={`grid grid-cols-4 text-center p-2.5 border-b border-slate-800/50 cursor-pointer transition items-center
                                    ${editingId === round.id ? 'bg-yellow-900/20 border-yellow-700/50' : 'hover:bg-slate-800/50'}`}>
                                    <div className="text-emerald-400 font-bold text-sm">{round.lana}</div>
                                    <div className="text-slate-400 text-[9px] font-bold bg-slate-800 px-1.5 py-0.5 rounded w-max mx-auto">{round.details}</div>
                                    <div className="text-slate-500 text-[10px]">{Math.abs(round.lana - round.lahoma)}</div>
                                    <div className="text-rose-400 font-bold text-sm">{round.lahoma}</div>
                                </div>
                            ))
                        )}
                    </div>

                    {/* Fullscreen Dictionary Modal */}
                    {isDictModalOpen && (
                        <div className="fixed inset-0 z-50 flex flex-col bg-[#0f172a] animate-slide-up">
                            <div className="flex justify-between items-center p-4 border-b border-slate-800 bg-slate-900 shrink-0">
                                <h3 className="text-lg font-bold text-white"><i className="fa-solid fa-book-open text-blue-500 mr-2"></i> القاموس</h3>
                                <button onClick={() => setIsDictModalOpen(false)} className="w-8 h-8 bg-slate-800 rounded-full flex items-center justify-center text-slate-400 btn-press"><i className="fa-solid fa-xmark"></i></button>
                            </div>

                            <div className="flex-1 overflow-y-auto p-4 space-y-4">
                                <details className="bg-slate-900 rounded-xl border border-slate-800 p-3 group">
                                    <summary className="text-xs font-bold text-slate-300 cursor-pointer outline-none flex justify-between items-center">
                                        عرض الكلمات الافتراضية للذكاء الاصطناعي
                                        <i className="fa-solid fa-chevron-down transition-transform group-open:rotate-180"></i>
                                    </summary>
                                    <div className="mt-3 space-y-3">
                                        <div>
                                            <h5 className="text-[10px] font-bold text-blue-400 mb-1 border-b border-slate-700 pb-1">الفريق:</h5>
                                            <div className="flex flex-wrap gap-1">
                                                {Object.keys(DEFAULT_TARGETS).map(w => <span key={w} className="bg-slate-800 text-slate-400 text-[9px] px-1.5 py-0.5 rounded border border-slate-700">{w}</span>)}
                                            </div>
                                        </div>
                                        <div>
                                            <h5 className="text-[10px] font-bold text-emerald-400 mb-1 border-b border-slate-700 pb-1">الأرقام:</h5>
                                            <div className="flex flex-wrap gap-1">
                                                {Object.keys(DEFAULT_NUMBERS).map(w => <span key={w} className="bg-slate-800 text-slate-400 text-[9px] px-1.5 py-0.5 rounded border border-slate-700">{w}</span>)}
                                            </div>
                                        </div>
                                    </div>
                                </details>

                                <div className="space-y-3 bg-slate-900 p-3 rounded-xl border border-slate-800">
                                    <h4 className="text-xs font-bold text-blue-400">إضافة لهجة/كلمة جديدة:</h4>
                                    <input type="text" placeholder="الكلمة" value={newWord} onChange={e => setNewWord(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded p-2 text-sm text-white focus:outline-none" />
                                    <div className="grid grid-cols-2 gap-2">
                                        <select value={newMeaningType} onChange={e => {setNewMeaningType(e.target.value); setNewMeaningVal('');}} className="bg-slate-950 border border-slate-700 rounded p-2 text-xs text-white">
                                            <option value="number">تُعبر عن رقم</option>
                                            <option value="target">تُعبر عن فريق</option>
                                        </select>
                                        {newMeaningType === 'number' ? 
                                            <input type="number" placeholder="القيمة" value={newMeaningVal} onChange={e => setNewMeaningVal(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded p-2 text-sm text-white" /> :
                                            <select value={newMeaningVal} onChange={e => setNewMeaningVal(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded p-2 text-xs text-white">
                                                <option value="" disabled>اختر الفريق</option><option value="lana">لنا</option><option value="lahoma">لهم</option>
                                            </select>
                                        }
                                    </div>
                                    <button onClick={handleAddWord} className="w-full py-2 rounded bg-blue-600 text-white text-xs font-bold btn-press">حفظ الكلمة</button>
                                </div>

                                <div className="space-y-2">
                                    <h4 className="text-xs font-bold text-slate-400 border-b border-slate-800 pb-1">المضافة يدوياً:</h4>
                                    {Object.entries(customDict.numbers).map(([w, v]) => (
                                        <div key={w} className="flex justify-between items-center bg-slate-900 p-2 rounded border border-slate-800">
                                            <span className="text-white text-xs font-bold">{w} <span className="text-emerald-400 text-[10px] ml-2">(رقم {v})</span></span>
                                            <button onClick={() => handleRemoveWord('numbers', w)} className="text-rose-400"><i className="fa-solid fa-trash text-xs"></i></button>
                                        </div>
                                    ))}
                                    {Object.entries(customDict.targets).map(([w, v]) => (
                                        <div key={w} className="flex justify-between items-center bg-slate-900 p-2 rounded border border-slate-800">
                                            <span className="text-white text-xs font-bold">{w} <span className="text-blue-400 text-[10px] ml-2">(فريق {v==='lana'?'لنا':'لهم'})</span></span>
                                            <button onClick={() => handleRemoveWord('targets', w)} className="text-rose-400"><i className="fa-solid fa-trash text-xs"></i></button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
