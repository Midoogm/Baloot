<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>125kg Bodyweight Tracker</title>
    <style>
        :root {
            --bg: #121212;
            --surface: #1e1e1e;
            --primary: #bb86fc;
            --text: #ffffff;
            --text-muted: #b3b3b3;
            --danger: #cf6679;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        h1, h2, h3 { margin: 0 0 15px 0; }
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            background-color: var(--surface);
            color: var(--primary);
            border: 2px solid var(--primary);
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: background-color 0.2s;
        }
        .btn:hover { background-color: var(--primary); color: var(--bg); }
        .btn-secondary { border-color: var(--text-muted); color: var(--text); }
        .btn-success { background-color: #03dac6; border-color: #03dac6; color: #000; }
        
        .view { display: none; }
        .view.active { display: block; }

        .exercise-card {
            background-color: var(--surface);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .media-placeholder {
            width: 100%;
            height: 200px;
            background-color: #333;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            overflow: hidden;
            color: var(--text-muted);
        }
        .media-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .links a {
            color: var(--primary);
            text-decoration: none;
            margin-right: 15px;
        }
        .input-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #333;
        }
        input[type="text"], input[type="number"] {
            background-color: #333;
            border: 1px solid #555;
            color: white;
            padding: 10px;
            border-radius: 4px;
            width: 80px;
            font-size: 1rem;
        }
        .history-item {
            background-color: var(--surface);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .history-date { font-size: 0.9rem; color: var(--text-muted); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>My Training log</h1>
    </header>

    <!-- HOME VIEW -->
    <div id="view-home" class="view active">
        <h2>What are we doing today?</h2>
        <button class="btn" onclick="startWorkout('pushPull')">Day 2: Push & Pull</button>
        <button class="btn" onclick="startWorkout('legsCore')">Day 4: Legs & Core</button>
        <button class="btn" onclick="startWorkout('cardio')">Cardio (30-45 min)</button>
        <button class="btn btn-secondary" style="margin-top: 40px;" onclick="showView('view-history')">View History Archive</button>
    </div>

    <!-- WORKOUT VIEW -->
    <div id="view-workout" class="view">
        <button class="btn btn-secondary" onclick="cancelWorkout()" style="padding: 10px; margin-bottom: 20px;">← Back to Menu</button>
        <h2 id="workout-title">Workout</h2>
        <div id="exercise-list"></div>
        <button class="btn btn-success" onclick="finishWorkout()">Finish & Save Workout</button>
    </div>

    <!-- HISTORY VIEW -->
    <div id="view-history" class="view">
        <button class="btn btn-secondary" onclick="showView('view-home')" style="padding: 10px; margin-bottom: 20px;">← Back to Menu</button>
        <h2>Archive</h2>
        <div id="history-list"></div>
        <button class="btn btn-secondary" onclick="clearHistory()" style="margin-top: 20px; border-color: var(--danger); color: var(--danger);">Clear All History</button>
    </div>
</div>

<script>
    // Database of routines
    const database = {
        pushPull: {
            title: "Push & Pull",
            exercises: [
                {
                    name: "Negative Pull-ups",
                    target: "3 sets of 3-5 reps",
                    desc: "Step up on a chair so your chin is above the bar. Take your feet off and lower yourself as slowly as humanly possible (3-5 seconds).",
                    video: "https://www.youtube.com/results?search_query=negative+pull+up+form",
                    img: "https://placehold.co/600x200/333/FFF?text=Negative+Pull-up" // Replace URL with a real GIF
                },
                {
                    name: "Active Bar Hangs",
                    target: "3 sets to failure",
                    desc: "Hang from the bar. Pull your shoulder blades down and back. Don't just dangle—keep tension in your lats.",
                    video: "https://www.youtube.com/results?search_query=active+bar+hang+form",
                    img: "https://placehold.co/600x200/333/FFF?text=Active+Bar+Hang"
                },
                {
                    name: "Incline Push-ups",
                    target: "3 sets of 8-12 reps",
                    desc: "Place hands on a sturdy counter or wall. Keep body in a straight line. Lower chest to the surface and push back up.",
                    video: "https://www.youtube.com/results?search_query=incline+push+up+form",
                    img: "https://placehold.co/600x200/333/FFF?text=Incline+Push-ups"
                },
                {
                    name: "Chair Tricep Dips",
                    target: "3 sets of 8-12 reps",
                    desc: "Sit on chair edge, hands next to hips. Slide butt off and lower down. Keep feet flat on floor.",
                    video: "https://www.youtube.com/results?search_query=chair+tricep+dips+form",
                    img: "https://placehold.co/600x200/333/FFF?text=Chair+Tricep+Dips"
                }
            ]
        },
        legsCore: {
            title: "Legs & Core",
            exercises: [
                {
                    name: "Box Squats",
                    target: "3 sets of 10-15 reps",
                    desc: "Stand in front of a chair. Squat with control until glutes tap the seat, immediately stand back up.",
                    video: "https://www.youtube.com/results?search_query=bodyweight+box+squat+form",
                    img: "https://placehold.co/600x200/333/FFF?text=Box+Squats"
                },
                {
                    name: "Glute Bridges",
                    target: "3 sets of 12-20 reps",
                    desc: "Lie on back, knees bent, feet flat. Drive heels down, push hips up, squeeze glutes.",
                    video: "https://www.youtube.com/results?search_query=glute+bridge+form",
                    img: "https://placehold.co/600x200/333/FFF?text=Glute+Bridges"
                },
                {
                    name: "Forearm Planks",
                    target: "3 sets to failure",
                    desc: "Body in a straight line. Use the floor, or put forearms on the couch if your lower back hurts.",
                    video: "https://www.youtube.com/results?search_query=forearm+plank+form",
                    img: "https://placehold.co/600x200/333/FFF?text=Forearm+Plank"
                },
                {
                    name: "Dead Bugs",
                    target: "3 sets of 10 reps/side",
                    desc: "Lie on back, arms up, knees at 90 deg. Lower opposite arm/leg to floor. Crush lower back into the floor.",
                    video: "https://www.youtube.com/results?search_query=dead+bug+exercise+form",
                    img: "https://placehold.co/600x200/333/FFF?text=Dead+Bugs"
                }
            ]
        },
        cardio: {
            title: "Cardio Day",
            exercises: [
                {
                    name: "Steady State Cardio",
                    target: "1 session, 30-45 mins",
                    desc: "Keep heart rate elevated but sustainable (e.g., brisk walking, stationary bike). You should be able to hold a conversation but not sing.",
                    video: "https://www.youtube.com/results?search_query=zone+2+cardio+explained",
                    img: "https://placehold.co/600x200/333/FFF?text=Steady+State+Cardio"
                }
            ]
        }
    };

    let currentSession = null;

    // View Navigation
    function showView(viewId) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(viewId).classList.add('active');
        if(viewId === 'view-history') renderHistory();
    }

    // Start a routine
    function startWorkout(type) {
        const routine = database[type];
        currentSession = {
            type: routine.title,
            date: new Date().toISOString(),
            logs: {}
        };
        
        document.getElementById('workout-title').innerText = routine.title;
        const listDiv = document.getElementById('exercise-list');
        listDiv.innerHTML = '';

        routine.exercises.forEach((ex, index) => {
            const card = document.createElement('div');
            card.className = 'exercise-card';
            card.innerHTML = `
                <h3>${ex.name}</h3>
                <div class="media-placeholder">
                    <img src="${ex.img}" alt="${ex.name} illustration">
                </div>
                <p><strong>Goal:</strong> ${ex.target}</p>
                <p>${ex.desc}</p>
                <div class="links">
                    <a href="${ex.video}" target="_blank">📺 Video Tutorial</a>
                </div>
                <div class="input-group">
                    <label>Log (Reps/Time):</label>
                    <input type="text" placeholder="e.g. 5,4,4" id="log-${index}" onchange="updateLog(${index}, this.value)">
                </div>
            `;
            listDiv.appendChild(card);
        });

        showView('view-workout');
    }

    // Save inputs during workout
    function updateLog(index, value) {
        if(currentSession) currentSession.logs[index] = value;
    }

    // Cancel without saving
    function cancelWorkout() {
        if(confirm("Cancel this workout? Data won't be saved.")) {
            currentSession = null;
            showView('view-home');
        }
    }

    // Finish and write to localStorage
    function finishWorkout() {
        let history = JSON.parse(localStorage.getItem('workoutHistory')) || [];
        history.push(currentSession);
        localStorage.setItem('workoutHistory', JSON.stringify(history));
        alert("Workout saved to Archive!");
        currentSession = null;
        showView('view-home');
    }

    // Render Archive
    function renderHistory() {
        const listDiv = document.getElementById('history-list');
        let history = JSON.parse(localStorage.getItem('workoutHistory')) || [];
        
        if(history.length === 0) {
            listDiv.innerHTML = '<p>No workouts saved yet.</p>';
            return;
        }

        // Reverse to show newest first
        listDiv.innerHTML = history.reverse().map(session => {
            const dateStr = new Date(session.date).toLocaleString();
            let logsHtml = '<ul style="margin-top:10px; padding-left:20px; color:#b3b3b3;">';
            
            // Re-map index to exercise names based on routine type
            let routineType = Object.keys(database).find(k => database[k].title === session.type);
            if(routineType) {
                database[routineType].exercises.forEach((ex, idx) => {
                    const loggedVal = session.logs[idx] || 'Not logged';
                    logsHtml += `<li><strong>${ex.name}:</strong> ${loggedVal}</li>`;
                });
            }
            logsHtml += '</ul>';

            return `
                <div class="history-item">
                    <div class="history-date">${dateStr}</div>
                    <h3 style="margin: 5px 0;">${session.type}</h3>
                    ${logsHtml}
                </div>
            `;
        }).join('');
    }

    // Clear history
    function clearHistory() {
        if(confirm("Are you sure you want to delete all saved workouts? This cannot be undone.")) {
            localStorage.removeItem('workoutHistory');
            renderHistory();
        }
    }
</script>

</body>
</html>
