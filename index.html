<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Baloot Pro - بلوت برو</title>
    
    <link rel="manifest" href='data:application/manifest+json,{"name":"Baloot Pro","short_name":"Baloot","display":"standalone","background_color":"#0f172a","theme_color":"#0f172a","icons":[{"src":"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIj48cmVjdCB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgZmlsbD0iIzBmMTcyYSIvPjx0ZXh0IHg9IjUwIiB5PSI2MCIgZm9udC1zaXplPSI1MCIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZmlsbD0iI2ZiYmYyNCI+4pmgPC90ZXh0Pjwvc3ZnPg==","sizes":"192x192","type":"image/svg+xml"}]}'>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap');
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            height: 100dvh; 
            margin: 0;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            overflow: hidden; /* STRICT ONE PAGE */
        }
        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .btn-press { transition: transform 0.1s ease; }
        .btn-press:active { transform: scale(0.94); }
        ::-webkit-scrollbar { width: 0px; background: transparent; } /* Hidden scrollbar for clean look */
        .chip { transition: all 0.2s ease; position: relative; }
        .chip.active { background-color: #3b82f6; color: white; border-color: #3b82f6; }
        .badge {
            position: absolute; top: -6px; right: -6px; background: #e11d48; color: white;
            border-radius: 50%; width: 18px; height: 18px; font-size: 10px; font-weight: 900;
            display: flex; align-items: center; justify-content: center; border: 2px solid #0f172a;
        }
        input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        
        /* Modal Animation */
        @keyframes popIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .animate-pop { animation: popIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
        if ('serviceWorker' in navigator) {
            const sw = `
                const CACHE = 'baloot-pro-offline';
                self.addEventListener('install', e => e.waitUntil(caches.open(CACHE).then(c => c.addAll([location.href]))));
                self.addEventListener('fetch', e => e.respondWith(caches.match(e.request).then(r => r || fetch(e.request))));
            `;
            const blob = new Blob([sw], { type: 'application/javascript' });
            navigator.serviceWorker.register(URL.createObjectURL(blob));
        }
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const SakahLimit = 152;
        const PROJECT_DEF = [
            { key: 'sira', label: 'سرا' }, { key: 'fifty', label: 'خمسين' },
            { key: 'hundred', label: 'مية' }, { key: 'fourHundred', label: '400' }, { key: 'baloot', label: 'بلوت' }
        ];
        
        const DEFAULT_NUMBERS = { "صفر":0,"واحد":1,"اثنين":2,"ثلاثه":3,"اربع":4,"خمس":5,"ست":6,"سبع":7,"ثمان":8,"تسع":9,"عشر":10,"عشره":10,"احداعش":11,"اثنعش":12,"ثلاثطعش":13,"اربعطعش":14,"خمسطعش":15,"ستطعش":16,"سبعطعش":17,"ثمانطعش":18,"تسعطعش":19,"عشرين":20,"واحد وعشرين":21,"اثنين وعشرين":22,"ثلاثه وعشرين":23,"اربعة وعشرين":24,"خمسة وعشرين":25,"ستة وعشرين":26 };
        const DEFAULT_TARGETS = { "لنا":"lana", "إحنا":"lana", "معنا":"lana", "لهم":"lahoma", "هم":"lahoma", "معهم":"lahoma" };

        const App = () => {
            const [history, setHistory] = useState([]);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [editId, setEditId] = useState(null);
            
            // Settings State
            const [gameMode, setGameMode] = useState('smart'); // 'smart' | 'free'
            const [autoAnnounce, setAutoAnnounce] = useState(true);
            const [customDict, setCustomDict] = useState({ numbers: {}, targets: {} });

            const [form, setForm] = useState(getEmptyForm());
            const [isListening, setIsListening] = useState(false);
            const [voiceFeedback, setVoiceFeedback] = useState("");
            const recognitionRef = useRef(null);

            function getEmptyForm() {
                return {
                    type: 'sun', buyer: 'lana',
                    projects: { lana: { sira: 0, fifty: 0, hundred: 0, fourHundred: 0, baloot: 0 }, lahoma: { sira: 0, fifty: 0, hundred: 0, fourHundred: 0, baloot: 0 } },
                    pointsLana: '', pointsLahoma: ''
                };
            }

            useEffect(() => {
                const h = localStorage.getItem('bp_hist'); if (h) try { setHistory(JSON.parse(h)); } catch(e){}
                const m = localStorage.getItem('bp_mode'); if (m) setGameMode(m);
                const a = localStorage.getItem('bp_ann'); if (a) setAutoAnnounce(a === 'true');
            }, []);

            useEffect(() => { localStorage.setItem('bp_hist', JSON.stringify(history)); }, [history]);
            useEffect(() => { localStorage.setItem('bp_mode', gameMode); }, [gameMode]);
            useEffect(() => { localStorage.setItem('bp_ann', autoAnnounce); }, [autoAnnounce]);

            // Voice Recognition
            useEffect(() => {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (SpeechRecognition) {
                    const recognition = new SpeechRecognition();
                    recognition.continuous = false; recognition.lang = 'ar-SA';
                    recognition.onstart = () => setIsListening(true);
                    recognition.onresult = (event) => processPointsTranscript(event.results[0][0].transcript);
                    recognition.onerror = () => { setVoiceFeedback("❌ لم أفهم"); setIsListening(false); };
                    recognition.onend = () => setIsListening(false);
                    recognitionRef.current = recognition;
                }
            }, [form, gameMode]);

            const processPointsTranscript = (transcript) => {
                let text = transcript.replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".toLowerCase());
                let foundNum = parseInt((text.match(/\d+/) || [])[0], 10) || null;
                let foundTarget = null;

                if (foundNum === null) {
                    for (const [w, v] of Object.entries(DEFAULT_NUMBERS)) { if (text.includes(w)) { foundNum = v; break; } }
                }
                for (const [w, v] of Object.entries(DEFAULT_TARGETS)) { if (text.includes(w)) { foundTarget = v; break; } }

                if (foundNum !== null) {
                    const max = form.type === 'sun' ? 26 : 16;
                    const isValid = gameMode === 'free' || foundNum <= max;
                    
                    if (isValid) {
                        const target = foundTarget || (gameMode === 'smart' ? form.buyer : 'lana');
                        setForm(prev => {
                            let u = { ...prev };
                            if (target === 'lana') { u.pointsLana = foundNum; if (gameMode === 'smart') u.pointsLahoma = max - foundNum; } 
                            else { u.pointsLahoma = foundNum; if (gameMode === 'smart') u.pointsLana = max - foundNum; }
                            return u;
                        });
                        setVoiceFeedback(`✅ ${foundNum} ${target === 'lana' ? 'لنا' : 'لهم'}`);
                    } else { setVoiceFeedback(`❌ تجاوز الحد (${max})`); }
                } else { setVoiceFeedback("❌ لم التقط الرقم"); }
            };

            const toggleListening = () => {
                if (!recognitionRef.current) return;
                isListening ? recognitionRef.current.stop() : recognitionRef.current.start();
            };

            const speakText = (text) => {
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(text);
                u.lang = 'ar-SA'; u.rate = 1.1;
                window.speechSynthesis.speak(u);
            };

            // Inputs
            const handlePointsChange = (team, valStr) => {
                valStr = valStr.replace(/^0+/, '');
                if (valStr === '') { setForm(p => ({ ...p, pointsLana: team === 'lana' ? '' : p.pointsLana, pointsLahoma: team === 'lahoma' ? '' : p.pointsLahoma })); return; }
                
                let val = parseInt(valStr, 10);
                if (isNaN(val)) return;

                if (gameMode === 'smart') {
                    const max = form.type === 'sun' ? 26 : 16;
                    if (val > max) val = parseInt(valStr.slice(-1), 10); // Auto-overwrite behavior
                    if (team === 'lana') setForm(p => ({ ...p, pointsLana: val, pointsLahoma: max - val }));
                    else setForm(p => ({ ...p, pointsLahoma: val, pointsLana: max - val }));
                } else {
                    // Free Mode
                    if (team === 'lana') setForm(p => ({ ...p, pointsLana: val }));
                    else setForm(p => ({ ...p, pointsLahoma: val }));
                }
            };

            const handleProj = (team, key) => {
                setForm(p => {
                    let u = { ...p }; u.projects[team] = { ...u.projects[team] }; u.projects[team][key] += 1; return u;
                });
            };

            const calcProjPts = (team, type) => {
                const p = form.projects[team];
                if (gameMode === 'free' || type === 'sun') return (p.sira*4) + (p.fifty*10) + (p.hundred*20) + (p.fourHundred*40) + (p.baloot*2);
                return (p.sira*2) + (p.fifty*5) + (p.hundred*10) + (p.baloot*2);
            };

            const calcResults = () => {
                let pL = parseInt(form.pointsLana) || 0; let pH = parseInt(form.pointsLahoma) || 0;
                let prL = calcProjPts('lana', form.type); let prH = calcProjPts('lahoma', form.type);
                
                if (gameMode === 'free') {
                    return { totLana: pL + prL, totLahoma: pH + prH, ready: (form.pointsLana !== '' || form.pointsLahoma !== '') };
                }

                let max = form.type === 'sun' ? 26 : 16;
                let kaboot = form.type === 'sun' ? 44 : 26;
                let tL = pL + prL, tH = pH + prH, msg = "";

                if (pL === max) { tL = kaboot + prL + prH; tH = 0; msg = "كبوت لنا 🔥"; } 
                else if (pH === max) { tH = kaboot + prL + prH; tL = 0; msg = "كبوت لهم 💀"; } 
                else if (form.buyer === 'lana' && tL <= tH && (pL + pH === max)) { tH = max + prL + prH; tL = 0; msg = "سقطنا 💔"; } 
                else if (form.buyer === 'lahoma' && tH <= tL && (pL + pH === max)) { tL = max + prL + prH; tH = 0; msg = "طيحناهم 🏆"; }

                return { totLana: tL, totLahoma: tH, lossMessage: msg, ready: (pL + pH === max) };
            };

            const submitRound = () => {
                const res = calcResults();
                if (!res.ready) return;

                const roundData = { id: editId || Date.now(), lana: res.totLana, lahoma: res.totLahoma, details: gameMode === 'smart' ? (form.type === 'sun' ? 'صن' : 'حكم') : 'حر' };
                
                if (editId) setHistory(history.map(r => r.id === editId ? roundData : r));
                else setHistory([roundData, ...history]);
                
                if (autoAnnounce && !editId) speakText(`النتيجة: حصلنا على ${res.totLana}، وهم ${res.totLahoma}`);
                
                closeModal();
            };

            const openEdit = (round) => {
                // In edit mode, we just inject raw numbers as free mode to avoid re-calculating complex lost rounds backwards
                setGameMode('free'); 
                setForm({ ...getEmptyForm(), pointsLana: round.lana, pointsLahoma: round.lahoma });
                setEditId(round.id);
                setIsModalOpen(true);
            };

            const closeModal = () => { setIsModalOpen(false); setEditId(null); setForm(getEmptyForm()); setVoiceFeedback(""); try{recognitionRef.current.stop()}catch(e){} };

            const tL = history.reduce((a, c) => a + c.lana, 0);
            const tH = history.reduce((a, c) => a + c.lahoma, 0);
            const preview = calcResults();

            return (
                <div className="flex flex-col h-[100dvh] bg-[#0f172a] overflow-hidden">
                    
                    {/* Compact Top Bar */}
                    <div className="px-4 pt-4 pb-2 shrink-0 flex justify-between items-center z-10">
                        <div className="flex gap-2">
                            <button onClick={() => {if(window.confirm("تصفير؟")) setHistory([])}} className="w-9 h-9 rounded-full bg-slate-800 text-slate-400 hover:text-white flex items-center justify-center btn-press"><i className="fa-solid fa-rotate-right"></i></button>
                            <button onClick={() => setGameMode(m => m === 'smart' ? 'free' : 'smart')} className={`w-9 h-9 rounded-full flex items-center justify-center btn-press font-bold text-xs ${gameMode==='smart'?'bg-indigo-600 text-white':'bg-slate-700 text-slate-300'}`}>
                                {gameMode==='smart' ? <i className="fa-solid fa-brain"></i> : <i className="fa-solid fa-unlock"></i>}
                            </button>
                        </div>
                        
                        <h1 className="text-xl font-black bg-gradient-to-r from-amber-400 to-orange-500 bg-clip-text text-transparent">بلوت برو</h1>
                        
                        <div className="flex gap-2">
                            <button onClick={() => speakText(`المجموع الكلي: لنا ${tL}، ولهم ${tH}`)} className="w-9 h-9 rounded-full bg-blue-600/20 text-blue-400 flex items-center justify-center btn-press"><i className="fa-solid fa-volume-high"></i></button>
                            <button onClick={() => setAutoAnnounce(!autoAnnounce)} className={`w-9 h-9 rounded-full flex items-center justify-center btn-press ${autoAnnounce?'bg-emerald-600/20 text-emerald-400':'bg-slate-800 text-slate-500'}`}>
                                <i className={`fa-solid ${autoAnnounce?'fa-comment-dots':'fa-comment-slash'}`}></i>
                            </button>
                        </div>
                    </div>

                    {/* Progress */}
                    <div className="px-4 pb-3 shrink-0">
                        <div className="w-full bg-slate-800 rounded-full h-1.5 flex overflow-hidden">
                            <div className="bg-emerald-500 h-full transition-all" style={{width: `${Math.min((tL/SakahLimit)*100, 100)}%`}}></div>
                            <div className="flex-1"></div>
                            <div className="bg-rose-500 h-full transition-all" style={{width: `${Math.min((tH/SakahLimit)*100, 100)}%`}}></div>
                        </div>
                    </div>

                    {/* Score Cards */}
                    <div className="px-4 pb-3 shrink-0 grid grid-cols-2 gap-3">
                        <div className="glass rounded-2xl p-4 flex flex-col items-center justify-center">
                            <span className="text-[10px] font-bold text-slate-400 uppercase">لنا (Us)</span>
                            <span className="text-4xl font-black text-white">{tL}</span>
                        </div>
                        <div className="glass rounded-2xl p-4 flex flex-col items-center justify-center">
                            <span className="text-[10px] font-bold text-slate-400 uppercase">لهم (Them)</span>
                            <span className="text-4xl font-black text-white">{tH}</span>
                        </div>
                    </div>

                    {/* Main Action */}
                    <div className="px-4 pb-3 shrink-0">
                        <button onClick={() => setIsModalOpen(true)} className="w-full py-3 rounded-xl bg-blue-600 text-white font-bold text-lg btn-press shadow-lg shadow-blue-900/30 flex justify-center items-center gap-2">
                            <i className="fa-solid fa-plus"></i> تسجيل جولة
                        </button>
                    </div>

                    {/* Ledger (Scrollable remaining space) */}
                    <div className="flex-1 glass rounded-t-3xl mx-2 flex flex-col overflow-hidden border border-slate-700/50 border-b-0 relative">
                        <div className="grid grid-cols-4 text-center bg-slate-900/80 p-2 font-bold text-slate-400 text-[10px] border-b border-slate-700/50 shrink-0 uppercase">
                            <div>لنا</div><div>النوع</div><div>تعديل</div><div>لهم</div>
                        </div>
                        <div className="flex-1 overflow-y-auto p-1 pb-4">
                            {history.length === 0 ? (
                                <div className="h-full flex flex-col items-center justify-center text-slate-600 opacity-50"><i className="fa-solid fa-spade text-3xl mb-2"></i><span className="text-xs">لا يوجد جولات</span></div>
                            ) : (
                                history.map((r) => (
                                    <div key={r.id} onClick={() => openEdit(r)} className="grid grid-cols-4 text-center p-2 border-b border-slate-800 hover:bg-slate-800/50 transition cursor-pointer items-center">
                                        <div className="text-emerald-400 font-bold">{r.lana > 0 ? r.lana : '-'}</div>
                                        <div className="text-slate-400 text-[10px] bg-slate-800 px-1 py-0.5 rounded w-max mx-auto">{r.details}</div>
                                        <div className="text-slate-600 text-xs"><i className="fa-solid fa-pen-to-square"></i></div>
                                        <div className="text-rose-400 font-bold">{r.lahoma > 0 ? r.lahoma : '-'}</div>
                                    </div>
                                ))
                            )}
                        </div>
                    </div>

                    {/* FULL SCREEN MODAL - ZERO SCROLLING */}
                    {isModalOpen && (
                        <div className="fixed inset-0 z-50 bg-slate-900 flex flex-col animate-pop">
                            
                            {/* Modal Header */}
                            <div className="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-950/50 shrink-0">
                                <h3 className="font-bold text-white flex items-center gap-2">
                                    {editId ? 'تعديل الجولة' : 'تسجيل النتيجة'} 
                                    <span className="text-[10px] bg-slate-700 px-2 py-0.5 rounded-full text-slate-300">{gameMode === 'smart' ? 'ذكي' : 'حر'}</span>
                                </h3>
                                <button onClick={closeModal} className="w-8 h-8 rounded-full bg-slate-800 text-slate-400 flex justify-center items-center btn-press"><i className="fa-solid fa-xmark"></i></button>
                            </div>

                            {/* Modal Body - Perfectly portioned using Flex */}
                            <div className="flex-1 flex flex-col p-4 gap-4 justify-center">
                                
                                {/* Projects (Always visible) */}
                                <div className="bg-slate-800/30 p-3 rounded-2xl border border-slate-700/50">
                                    <div className="flex flex-col gap-3">
                                        <div className="flex items-center gap-2 overflow-x-auto pb-1" style={{scrollbarWidth:'none'}}>
                                            <span className="text-[10px] text-emerald-400 font-bold shrink-0">لنا:</span>
                                            {PROJECT_DEF.map(p => {
                                                const c = form.projects.lana[p.key];
                                                return <button key={'l'+p.key} onClick={() => handleProj('lana', p.key)} className={`chip px-3 py-1.5 rounded-lg text-xs font-bold shrink-0 ${c>0?'bg-emerald-600 text-white':'bg-slate-800 text-slate-400 border border-slate-700'}`}>{p.label} {c>0&&<span className="badge bg-slate-900">{c}</span>}</button>
                                            })}
                                            {Object.values(form.projects.lana).some(v=>v>0) && <button onClick={()=>setForm(p=>{let u={...p}; u.projects.lana={sira:0,fifty:0,hundred:0,fourHundred:0,baloot:0}; return u})} className="p-1.5 text-rose-400 shrink-0"><i className="fa-solid fa-xmark"></i></button>}
                                        </div>
                                        <div className="flex items-center gap-2 overflow-x-auto pb-1" style={{scrollbarWidth:'none'}}>
                                            <span className="text-[10px] text-rose-400 font-bold shrink-0">لهم:</span>
                                            {PROJECT_DEF.map(p => {
                                                const c = form.projects.lahoma[p.key];
                                                return <button key={'h'+p.key} onClick={() => handleProj('lahoma', p.key)} className={`chip px-3 py-1.5 rounded-lg text-xs font-bold shrink-0 ${c>0?'bg-rose-600 text-white':'bg-slate-800 text-slate-400 border border-slate-700'}`}>{p.label} {c>0&&<span className="badge bg-slate-900">{c}</span>}</button>
                                            })}
                                            {Object.values(form.projects.lahoma).some(v=>v>0) && <button onClick={()=>setForm(p=>{let u={...p}; u.projects.lahoma={sira:0,fifty:0,hundred:0,fourHundred:0,baloot:0}; return u})} className="p-1.5 text-rose-400 shrink-0"><i className="fa-solid fa-xmark"></i></button>}
                                        </div>
                                    </div>
                                </div>

                                {/* Smart Mode Toggles */}
                                {gameMode === 'smart' && (
                                    <div className="grid grid-cols-2 gap-3">
                                        <div className="flex bg-slate-950 p-1 rounded-xl border border-slate-800">
                                            <button onClick={()=>handleTypeChange('sun')} className={`flex-1 py-1.5 rounded-lg text-xs font-bold transition-all ${form.type==='sun'?'bg-indigo-600 text-white':'text-slate-500'}`}>صن</button>
                                            <button onClick={()=>handleTypeChange('hokom')} className={`flex-1 py-1.5 rounded-lg text-xs font-bold transition-all ${form.type==='hokom'?'bg-indigo-600 text-white':'text-slate-500'}`}>حكم</button>
                                        </div>
                                        <div className="flex bg-slate-950 p-1 rounded-xl border border-slate-800">
                                            <button onClick={()=>setForm(p=>({...p, buyer:'lana'}))} className={`flex-1 py-1.5 rounded-lg text-xs font-bold transition-all ${form.buyer==='lana'?'bg-emerald-600 text-white':'text-slate-500'}`}>لنا</button>
                                            <button onClick={()=>setForm(p=>({...p, buyer:'lahoma'}))} className={`flex-1 py-1.5 rounded-lg text-xs font-bold transition-all ${form.buyer==='lahoma'?'bg-rose-600 text-white':'text-slate-500'}`}>لهم</button>
                                        </div>
                                    </div>
                                )}

                                {/* Points Entry (The core) */}
                                <div className="bg-slate-950/50 p-4 rounded-3xl border border-slate-800 shadow-inner flex-1 flex flex-col justify-center">
                                    <div className="grid grid-cols-[1fr,auto,1fr] gap-3 items-center">
                                        <div className="relative flex flex-col items-center">
                                            <label className="text-[10px] text-slate-500 mb-1">لنا</label>
                                            <input type="number" inputMode="numeric" pattern="[0-9]*" value={form.pointsLana} onChange={e=>handlePointsChange('lana', e.target.value)} onFocus={e=>e.target.select()} className="w-full bg-slate-900 border border-slate-700 rounded-2xl py-4 text-3xl font-black text-center text-emerald-400 focus:outline-none focus:border-emerald-500 focus:bg-slate-800 transition-colors" placeholder="0" />
                                        </div>
                                        
                                        <button onClick={toggleListening} className={`w-14 h-14 rounded-full flex items-center justify-center text-xl transition-all btn-press shadow-lg z-10 mt-5 ${isListening ? 'bg-rose-600 text-white shadow-[0_0_20px_#e11d48] scale-110 animate-pulse border-rose-400' : 'bg-blue-600 text-white shadow-blue-900/50'}`}>
                                            <i className={`fa-solid ${isListening ? 'fa-stop' : 'fa-microphone'}`}></i>
                                        </button>

                                        <div className="relative flex flex-col items-center">
                                            <label className="text-[10px] text-slate-500 mb-1">لهم</label>
                                            <input type="number" inputMode="numeric" pattern="[0-9]*" value={form.pointsLahoma} onChange={e=>handlePointsChange('lahoma', e.target.value)} onFocus={e=>e.target.select()} className="w-full bg-slate-900 border border-slate-700 rounded-2xl py-4 text-3xl font-black text-center text-rose-400 focus:outline-none focus:border-rose-500 focus:bg-slate-800 transition-colors" placeholder="0" />
                                        </div>
                                    </div>

                                    {voiceFeedback && <p className={`text-center mt-3 text-xs font-bold ${voiceFeedback.includes('✅')?'text-emerald-400':'text-rose-400'}`}>{voiceFeedback}</p>}
                                    
                                    {/* Real-time Math Preview */}
                                    <div className="mt-4 flex justify-center items-center gap-3">
                                        <span className="text-xl font-bold text-emerald-400">{preview.totLana}</span>
                                        <span className="text-slate-600 text-sm">-</span>
                                        <span className="text-xl font-bold text-rose-400">{preview.totLahoma}</span>
                                    </div>
                                    {preview.lossMessage && <div className="text-center text-rose-500 text-sm font-bold mt-1 animate-pulse">{preview.lossMessage}</div>}
                                </div>
                            </div>

                            {/* Submit Button */}
                            <div className="p-4 bg-slate-950 shrink-0 pb-8 sm:pb-4 border-t border-slate-800">
                                <button onClick={submitRound} disabled={!preview.ready} className={`w-full py-4 rounded-xl font-bold text-lg transition-all btn-press flex justify-center items-center gap-2 ${preview.ready ? 'bg-emerald-600 text-white shadow-[0_0_15px_rgba(16,185,129,0.3)]' : 'bg-slate-800 text-slate-600'}`}>
                                    {editId ? 'حفظ التعديل' : 'اعتماد النتيجة'} <i className="fa-solid fa-check"></i>
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
