<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Baloot Pro Tracker - بلوت برو</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');
        body {
            font-family: 'Tajawal', sans-serif;
            background: radial-gradient(circle at top, #1e293b, #020617);
            color: #f8fafc;
            min-height: 100vh;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }
        .gold-text {
            background: linear-gradient(to right, #fbbf24, #d97706);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .btn-press { transition: transform 0.1s, opacity 0.2s; }
        .btn-press:active { transform: scale(0.95); }
        .progress-bar { transition: width 0.5s ease-out; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
        .chip { transition: all 0.2s ease; }
        .chip.active {
            background-color: #3b82f6;
            color: white;
            border-color: #60a5fa;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const SakahLimit = 152;

        const App = () => {
            const [history, setHistory] = useState([]);
            const [isModalOpen, setIsModalOpen] = useState(false);
            
            // Round Wizard State
            const [form, setForm] = useState({
                type: 'sun',
                buyer: 'lana',
                projLana: 0,
                projLahoma: 0,
                pointsLana: '',
                pointsLahoma: ''
            });

            // Voice & Conversation State
            const [isListening, setIsListening] = useState(false);
            const [isSpeaking, setIsSpeaking] = useState(false);
            const [transcriptLog, setTranscriptLog] = useState("");
            const [assistantMessage, setAssistantMessage] = useState("اضغط على المايك لبدء المحادثة...");
            const [convStep, setConvStep] = useState('idle'); // idle, type, buyer, projects, points
            
            const recognitionRef = useRef(null);

            // Load & Save History
            useEffect(() => {
                const saved = localStorage.getItem('balootProHistoryV3');
                if (saved) {
                    try { setHistory(JSON.parse(saved)); } catch (e) {}
                }
            }, []);

            useEffect(() => {
                localStorage.setItem('balootProHistoryV3', JSON.stringify(history));
            }, [history]);

            // Setup Voice Recognition
            useEffect(() => {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (SpeechRecognition) {
                    const recognition = new SpeechRecognition();
                    recognition.continuous = false;
                    recognition.interimResults = false;
                    recognition.lang = 'ar-SA'; 
                    
                    recognition.onstart = () => setIsListening(true);
                    
                    recognition.onresult = (event) => {
                        const transcript = event.results[0][0].transcript;
                        setTranscriptLog(transcript); // Show exact transcript for troubleshooting
                        handleConversationalStep(transcript);
                    };
                    
                    recognition.onerror = () => {
                        setIsListening(false);
                        if (convStep !== 'idle') {
                            speakAndListen("لم أسمعك بوضوح. هل يمكنك الإعادة؟", convStep);
                        }
                    };
                    
                    recognition.onend = () => setIsListening(false);
                    recognitionRef.current = recognition;
                }
            }, [form, convStep]);

            // Text-to-Speech Engine with Loop linking
            const speakAndListen = (text, nextStep) => {
                window.speechSynthesis.cancel(); // Stop current speech if any
                setAssistantMessage(text);
                setConvStep(nextStep);
                
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ar-SA';
                utterance.rate = 1.1; // Slightly faster for fluidity
                
                utterance.onstart = () => setIsSpeaking(true);
                utterance.onend = () => {
                    setIsSpeaking(false);
                    if (nextStep !== 'idle' && nextStep !== 'done' && recognitionRef.current) {
                        try { recognitionRef.current.start(); } catch(e) {}
                    }
                };
                
                window.speechSynthesis.speak(utterance);
            };

            // Manual Points calculation
            const handlePointsChange = (team, value) => {
                const val = parseInt(value) || 0;
                const max = form.type === 'sun' ? 26 : 16;
                if (value === '') {
                    setForm(prev => ({ ...prev, pointsLana: '', pointsLahoma: '' }));
                    return;
                }
                if (val > max) return;
                if (team === 'lana') setForm(prev => ({ ...prev, pointsLana: val, pointsLahoma: max - val }));
                else setForm(prev => ({ ...prev, pointsLahoma: val, pointsLana: max - val }));
            };

            const handleTypeChange = (type) => setForm(prev => ({ ...prev, type, pointsLana: '', pointsLahoma: '' }));

            // Conversational NLP State Machine
            const handleConversationalStep = (transcript) => {
                let text = transcript.replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).toLowerCase();
                let updates = { ...form };

                if (convStep === 'type') {
                    if (text.includes('صن') || text.includes('سن')) {
                        updates.type = 'sun';
                        setForm(updates);
                        speakAndListen("صن. مين المشتري؟ لنا ولا لهم؟", 'buyer');
                    } else if (text.includes('حكم')) {
                        updates.type = 'hokom';
                        setForm(updates);
                        speakAndListen("حكم. مين المشتري؟ لنا ولا لهم؟", 'buyer');
                    } else {
                        speakAndListen("عفواً، اللعب صن ولا حكم؟", 'type');
                    }
                } 
                else if (convStep === 'buyer') {
                    if (text.includes('لنا') || text.includes('احنا')) {
                        updates.buyer = 'lana';
                        setForm(updates);
                        speakAndListen("المشتري لنا. هل فيه مشاريع؟ قلها أو قل بدون.", 'projects');
                    } else if (text.includes('لهم') || text.includes('اشتروا')) {
                        updates.buyer = 'lahoma';
                        setForm(updates);
                        speakAndListen("المشتري لهم. هل فيه مشاريع؟ قلها أو قل بدون.", 'projects');
                    } else {
                        speakAndListen("مين المشتري؟", 'buyer');
                    }
                }
                else if (convStep === 'projects') {
                    if (text.includes('بدون') || text.includes('لا') || text.includes('مافيه')) {
                        speakAndListen("بدون مشاريع. كم الأبناط؟", 'points');
                        return;
                    }
                    
                    let foundProjects = false;
                    // Check generic projects for buyer
                    if (text.includes('سرا') || text.includes('سرى')) {
                        if (updates.buyer === 'lana') updates.projLana += 2; else updates.projLahoma += 2;
                        foundProjects = true;
                    }
                    if (text.includes('خمسين')) {
                        if (updates.buyer === 'lana') updates.projLana += 5; else updates.projLahoma += 5;
                        foundProjects = true;
                    }
                    if (text.includes('ميه') || text.includes('مية')) {
                        if (updates.buyer === 'lana') updates.projLana += 10; else updates.projLahoma += 10;
                        foundProjects = true;
                    }
                    
                    setForm(updates);
                    if (foundProjects) {
                        speakAndListen("سجلت المشاريع. كم الأبناط؟", 'points');
                    } else {
                        speakAndListen("لم أفهم المشاريع. يمكنك إدخالها يدوياً أو قل الأبناط.", 'points');
                    }
                }
                else if (convStep === 'points') {
                    const words = {
                        "صفر":0,"واحد":1,"اثنين":2,"ثلاثه":3,"ثلاثة":3,"اربع":4,"اربعة":4,"اربعه":4,"خمسه":5,"خمسة":5,
                        "سته":6,"ستة":6,"سبعه":7,"سبعة":7,"ثمانيه":8,"ثمانية":8,"تسعه":9,"تسعة":9,"عشره":10,"عشرة":10,
                        "احداعش":11,"اثناعش":12,"ثلاثطعش":13,"اربعطعش":14,"خمسطعش":15,"ستطعش":16,"سبعطعش":17,
                        "ثمانطعش":18,"تسعطعش":19,"عشرين":20,"واحد وعشرين":21,"اثنين وعشرين":22,"ثلاثه وعشرين":23,
                        "اربعة وعشرين":24,"خمسة وعشرين":25,"ستة وعشرين":26
                    };

                    let foundNumber = null;
                    const matches = text.match(/\d+/);
                    if (matches) foundNumber = parseInt(matches[0], 10);
                    else {
                        for (let w in words) {
                            if (text.includes(w)) { foundNumber = words[w]; break; }
                        }
                    }

                    if (foundNumber !== null) {
                        const max = updates.type === 'sun' ? 26 : 16;
                        if (foundNumber <= max) {
                            if (text.includes('لهم') && !text.includes('لنا')) {
                                updates.pointsLahoma = foundNumber;
                                updates.pointsLana = max - foundNumber;
                            } else {
                                updates.pointsLana = foundNumber;
                                updates.pointsLahoma = max - foundNumber;
                            }
                            setForm(updates);
                            speakAndListen("تم حساب النتيجة. راجعها ثم اضغط اعتماد.", 'done');
                        } else {
                            speakAndListen("الرقم أكبر من المسموح. كم الأبناط؟", 'points');
                        }
                    } else {
                        speakAndListen("لم أسمع رقماً. كم الأبناط؟", 'points');
                    }
                }
            };

            const startConversation = () => {
                if (!recognitionRef.current) return alert("المتصفح لا يدعم التعرف على الصوت.");
                setForm({ type: 'sun', buyer: 'lana', projLana: 0, projLahoma: 0, pointsLana: '', pointsLahoma: '' });
                setTranscriptLog("");
                speakAndListen("نوع اللعب صن ولا حكم؟", 'type');
            };

            const stopConversation = () => {
                window.speechSynthesis.cancel();
                if (recognitionRef.current) recognitionRef.current.stop();
                setConvStep('idle');
                setAssistantMessage("تم إيقاف المساعد الصوتي.");
            };

            const calculateResults = () => {
                let baseLana = parseInt(form.pointsLana) || 0;
                let baseLahoma = parseInt(form.pointsLahoma) || 0;
                let maxPts = form.type === 'sun' ? 26 : 16;
                let kabootPts = form.type === 'sun' ? 44 : 26;
                let totLana = baseLana + form.projLana;
                let totLahoma = baseLahoma + form.projLahoma;
                let isLoss = false;
                let lossMessage = "";

                if (baseLana === maxPts) {
                    totLana = kabootPts + form.projLana + form.projLahoma;
                    totLahoma = 0;
                    lossMessage = "كبوت لنا! 🔥";
                } else if (baseLahoma === maxPts) {
                    totLahoma = kabootPts + form.projLana + form.projLahoma;
                    totLana = 0;
                    lossMessage = "كبوت لهم! 💀";
                } else {
                    if (form.buyer === 'lana' && totLana <= totLahoma && (baseLana + baseLahoma === maxPts)) {
                        isLoss = true;
                        totLahoma = maxPts + form.projLana + form.projLahoma;
                        totLana = 0;
                        lossMessage = "خسارة علينا! (سقطنا) 💔";
                    } else if (form.buyer === 'lahoma' && totLahoma <= totLana && (baseLana + baseLahoma === maxPts)) {
                        isLoss = true;
                        totLana = maxPts + form.projLana + form.projLahoma;
                        totLahoma = 0;
                        lossMessage = "خسارة عليهم! (طيحناهم) 🏆";
                    }
                }

                return { totLana, totLahoma, isLoss, lossMessage, ready: (baseLana + baseLahoma === maxPts) };
            };

            const submitRound = () => {
                const results = calculateResults();
                if (!results.ready) return alert("الرجاء إدخال الأبناط بشكل صحيح لتكتمل الجولة.");
                
                setHistory([{ id: Date.now(), lana: results.totLana, lahoma: results.totLahoma, details: form.type === 'sun' ? 'صن' : 'حكم' }, ...history]);
                setIsModalOpen(false);
                stopConversation();
            };

            const resetGame = () => { if (window.confirm("تصفير النتيجة؟")) setHistory([]); };

            const totalLana = history.reduce((acc, curr) => acc + curr.lana, 0);
            const totalLahoma = history.reduce((acc, curr) => acc + curr.lahoma, 0);
            const preview = calculateResults();

            return (
                <div className="max-w-md mx-auto p-4 flex flex-col h-screen">
                    <div className="flex justify-between items-center mb-6 pt-2">
                        <button onClick={resetGame} className="text-slate-400 hover:text-white p-2"><i className="fa-solid fa-rotate-right text-xl"></i></button>
                        <h1 className="text-3xl font-black tracking-wider gold-text">بلوت برو</h1>
                        <button onClick={() => history.length > 0 && setHistory(history.slice(1))} className={`p-2 ${history.length === 0 ? 'text-slate-600' : 'text-slate-400 hover:text-white'}`}><i className="fa-solid fa-arrow-rotate-left text-xl"></i></button>
                    </div>

                    <div className="w-full bg-slate-800 rounded-full h-2 mb-6 flex shadow-inner">
                        <div className="bg-emerald-500 h-full progress-bar" style={{width: `${Math.min((totalLana/SakahLimit)*100, 100)}%`}}></div>
                        <div className="flex-1"></div>
                        <div className="bg-rose-500 h-full progress-bar" style={{width: `${Math.min((totalLahoma/SakahLimit)*100, 100)}%`}}></div>
                    </div>

                    <div className="grid grid-cols-2 gap-4 mb-6">
                        <div className="glass-panel rounded-3xl p-6 flex flex-col items-center">
                            <h2 className="text-xl font-bold text-slate-300 mb-2">لنا (Us)</h2>
                            <span className="text-6xl font-black text-white">{totalLana}</span>
                        </div>
                        <div className="glass-panel rounded-3xl p-6 flex flex-col items-center">
                            <h2 className="text-xl font-bold text-slate-300 mb-2">لهم (Them)</h2>
                            <span className="text-6xl font-black text-white">{totalLahoma}</span>
                        </div>
                    </div>

                    <button onClick={() => { setIsModalOpen(true); setTranscriptLog(""); }} className="w-full py-4 rounded-2xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 text-white font-bold text-xl btn-press shadow-lg mb-6 flex items-center justify-center">
                        <i className="fa-solid fa-pen-to-square mr-3"></i> تسجيل جولة جديدة
                    </button>

                    <div className="flex-1 glass-panel rounded-t-3xl overflow-hidden flex flex-col">
                        <div className="grid grid-cols-4 text-center bg-slate-800/80 p-3 font-bold text-slate-400 text-sm border-b border-slate-700">
                            <div>لنا</div><div>لعب</div><div>الفرق</div><div>لهم</div>
                        </div>
                        <div className="flex-1 overflow-y-auto p-2">
                            {history.map((round) => (
                                <div key={round.id} className="grid grid-cols-4 text-center p-3 border-b border-slate-700/50 hover:bg-slate-800/30 transition items-center">
                                    <div className="text-emerald-400 font-bold text-lg">{round.lana > 0 ? round.lana : '-'}</div>
                                    <div className="text-slate-500 text-xs font-bold bg-slate-800 px-2 py-1 rounded w-max mx-auto">{round.details}</div>
                                    <div className="text-slate-500 text-sm">{Math.abs(round.lana - round.lahoma) > 0 ? Math.abs(round.lana - round.lahoma) : '-'}</div>
                                    <div className="text-rose-400 font-bold text-lg">{round.lahoma > 0 ? round.lahoma : '-'}</div>
                                </div>
                            ))}
                        </div>
                    </div>

                    {isModalOpen && (
                        <div className="fixed inset-0 bg-slate-950/95 backdrop-blur-md z-50 flex flex-col p-4 animate-[fadeIn_0.2s_ease-out] overflow-y-auto">
                            <div className="flex justify-between items-center mb-4 pt-2">
                                <h3 className="text-2xl font-bold text-white">تسجيل الجولة</h3>
                                <button onClick={() => {setIsModalOpen(false); stopConversation();}} className="text-slate-400 bg-slate-800 rounded-full w-10 h-10 flex items-center justify-center"><i className="fa-solid fa-xmark"></i></button>
                            </div>

                            {/* Assistant Panel */}
                            <div className="bg-slate-900 rounded-2xl p-4 mb-4 border border-blue-900/50 flex flex-col shadow-lg relative overflow-hidden">
                                {isSpeaking && <div className="absolute top-0 left-0 w-full h-1 bg-blue-500 animate-pulse"></div>}
                                {isListening && <div className="absolute top-0 left-0 w-full h-1 bg-emerald-500 animate-pulse"></div>}
                                
                                <div className="flex items-center mb-3">
                                    <button onClick={convStep === 'idle' ? startConversation : stopConversation} 
                                        className={`w-14 h-14 rounded-full flex items-center justify-center text-2xl mr-4 btn-press transition-colors ${convStep !== 'idle' ? 'bg-rose-600 text-white shadow-[0_0_15px_#e11d48]' : 'bg-blue-600 text-white shadow-[0_0_15px_#2563eb]'}`}>
                                        <i className={`fa-solid ${convStep !== 'idle' ? 'fa-stop' : 'fa-play'}`}></i>
                                    </button>
                                    <div className="flex-1">
                                        <p className="text-xs text-blue-400 mb-1 font-bold"><i className="fa-solid fa-robot mr-1"></i> المساعد الصوتي</p>
                                        <p className="text-sm text-white font-medium">{assistantMessage}</p>
                                    </div>
                                </div>

                                {/* Troubleshooting Transcript Box */}
                                <div className="bg-black/50 rounded-xl p-3 border border-slate-700 font-mono text-sm">
                                    <span className="text-slate-500 text-xs block mb-1">سمعت:</span>
                                    <span className={transcriptLog ? "text-emerald-400" : "text-slate-600 italic"}>
                                        {transcriptLog || "..."}
                                    </span>
                                </div>
                            </div>

                            {/* Manual Form (Updates automatically from voice) */}
                            <div className="glass-panel rounded-3xl p-5 mb-4 border border-slate-700 space-y-5">
                                <div className="grid grid-cols-2 gap-4">
                                    <div className="space-y-2">
                                        <label className="text-xs text-slate-400 font-bold">نوع اللعب:</label>
                                        <div className="flex bg-slate-800 rounded-xl p-1">
                                            <button onClick={() => handleTypeChange('sun')} className={`flex-1 py-2 rounded-lg font-bold text-sm ${form.type === 'sun' ? 'bg-indigo-600 text-white' : 'text-slate-400'}`}>صن</button>
                                            <button onClick={() => handleTypeChange('hokom')} className={`flex-1 py-2 rounded-lg font-bold text-sm ${form.type === 'hokom' ? 'bg-indigo-600 text-white' : 'text-slate-400'}`}>حكم</button>
                                        </div>
                                    </div>
                                    <div className="space-y-2">
                                        <label className="text-xs text-slate-400 font-bold">المشتري:</label>
                                        <div className="flex bg-slate-800 rounded-xl p-1">
                                            <button onClick={() => setForm({...form, buyer: 'lana'})} className={`flex-1 py-2 rounded-lg font-bold text-sm ${form.buyer === 'lana' ? 'bg-emerald-600 text-white' : 'text-slate-400'}`}>لنا</button>
                                            <button onClick={() => setForm({...form, buyer: 'lahoma'})} className={`flex-1 py-2 rounded-lg font-bold text-sm ${form.buyer === 'lahoma' ? 'bg-rose-600 text-white' : 'text-slate-400'}`}>لهم</button>
                                        </div>
                                    </div>
                                </div>

                                <div>
                                    <label className="text-xs text-slate-400 font-bold mb-2 block">مشاريعنا (لنا): {form.projLana > 0 && <span className="text-emerald-400 ml-2">+{form.projLana}</span>}</label>
                                    <div className="flex flex-wrap gap-2">
                                        {[ {l:'سرا',v:2}, {l:'خمسين',v:5}, {l:'مية',v:10}, {l:'اربعمية',v:40}, {l:'بلوت',v:2} ].map(p => (
                                            <button key={'lana'+p.l} onClick={() => setForm({...form, projLana: form.projLana === p.v ? 0 : form.projLana + p.v})} 
                                                className={`chip px-3 py-1.5 rounded-lg text-sm font-bold border border-slate-700 bg-slate-800 text-slate-300 ${form.projLana >= p.v ? 'active' : ''}`}>{p.l}</button>
                                        ))}
                                        <button onClick={() => setForm({...form, projLana: 0})} className="px-3 py-1.5 rounded-lg text-xs font-bold border border-rose-900/50 bg-rose-900/20 text-rose-400"><i className="fa-solid fa-xmark"></i></button>
                                    </div>
                                </div>

                                <div>
                                    <label className="text-xs text-slate-400 font-bold mb-2 block">مشاريعهم (لهم): {form.projLahoma > 0 && <span className="text-rose-400 ml-2">+{form.projLahoma}</span>}</label>
                                    <div className="flex flex-wrap gap-2">
                                        {[ {l:'سرا',v:2}, {l:'خمسين',v:5}, {l:'مية',v:10}, {l:'اربعمية',v:40}, {l:'بلوت',v:2} ].map(p => (
                                            <button key={'lahoma'+p.l} onClick={() => setForm({...form, projLahoma: form.projLahoma === p.v ? 0 : form.projLahoma + p.v})} 
                                                className={`chip px-3 py-1.5 rounded-lg text-sm font-bold border border-slate-700 bg-slate-800 text-slate-300 ${form.projLahoma >= p.v ? 'active' : ''}`}>{p.l}</button>
                                        ))}
                                        <button onClick={() => setForm({...form, projLahoma: 0})} className="px-3 py-1.5 rounded-lg text-xs font-bold border border-rose-900/50 bg-rose-900/20 text-rose-400"><i className="fa-solid fa-xmark"></i></button>
                                    </div>
                                </div>

                                <div>
                                    <label className="text-xs text-slate-400 font-bold mb-2 block">الأبناط (المجموع {form.type === 'sun' ? 26 : 16}):</label>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="relative">
                                            <span className="absolute right-3 top-1/2 -translate-y-1/2 text-sm text-slate-500 font-bold">لنا</span>
                                            <input type="number" value={form.pointsLana} onChange={(e) => handlePointsChange('lana', e.target.value)}
                                                className="w-full bg-slate-900 border border-slate-600 rounded-xl py-3 pr-10 pl-3 text-2xl font-black text-center text-white" placeholder="0" />
                                        </div>
                                        <div className="relative">
                                            <span className="absolute right-3 top-1/2 -translate-y-1/2 text-sm text-slate-500 font-bold">لهم</span>
                                            <input type="number" value={form.pointsLahoma} onChange={(e) => handlePointsChange('lahoma', e.target.value)}
                                                className="w-full bg-slate-900 border border-slate-600 rounded-xl py-3 pr-10 pl-3 text-2xl font-black text-center text-white" placeholder="0" />
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div className="bg-slate-800 rounded-2xl p-4 border border-slate-700 mb-6 text-center shadow-lg">
                                {preview.ready ? (
                                    <>
                                        <div className="flex justify-center items-center gap-6 text-2xl font-black mb-2">
                                            <span className={preview.totLana > preview.totLahoma ? "text-emerald-400" : "text-white"}>{preview.totLana}</span>
                                            <span className="text-slate-600">-</span>
                                            <span className={preview.totLahoma > preview.totLana ? "text-rose-400" : "text-white"}>{preview.totLahoma}</span>
                                        </div>
                                        {preview.lossMessage && <div className="text-rose-400 text-sm font-bold animate-pulse">{preview.lossMessage}</div>}
                                    </>
                                ) : <p className="text-slate-500 text-sm">أدخل الأبناط لمعرفة النتيجة</p>}
                            </div>

                            <button onClick={submitRound} disabled={!preview.ready} className={`w-full py-4 rounded-2xl font-black text-xl transition-all ${preview.ready ? 'bg-emerald-600 hover:bg-emerald-500 text-white shadow-[0_0_20px_rgba(16,185,129,0.4)] btn-press' : 'bg-slate-800 text-slate-500'}`}>
                                اعتماد النتيجة
                            </button>
                            <div className="pb-10"></div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
