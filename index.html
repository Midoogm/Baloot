<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <title>Baloot Pro Tracker - بلوت برو</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap');
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #0f172a; /* Fallback */
            background: radial-gradient(circle at top, #1e293b, #020617);
            color: #f8fafc;
            /* Use dvh for modern mobile browsers to account for address bars */
            height: 100dvh; 
            margin: 0;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            overflow: hidden; /* Prevent body scroll, handle inside React */
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        .gold-text {
            background: linear-gradient(to right, #fbbf24, #d97706);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .btn-press { transition: transform 0.1s ease, opacity 0.2s ease, box-shadow 0.2s ease; }
        .btn-press:active { transform: scale(0.96); }
        .progress-bar { transition: width 0.5s ease-out; }
        
        /* Smooth Scrollbars */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        
        /* Modern Chip styling */
        .chip { transition: all 0.2s ease; }
        .chip.active {
            background-color: #3b82f6;
            color: white;
            border-color: #3b82f6;
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.4);
        }
        
        /* Bottom Sheet Animation */
        @keyframes slideUpSheet {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .animate-slide-up {
            animation: slideUpSheet 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const SakahLimit = 152;

        const App = () => {
            const [history, setHistory] = useState([]);
            const [isModalOpen, setIsModalOpen] = useState(false);
            
            // Round Wizard State
            const [form, setForm] = useState({
                type: 'sun',
                buyer: 'lana',
                projLana: 0,
                projLahoma: 0,
                pointsLana: '',
                pointsLahoma: ''
            });

            // Voice & Conversation State
            const [isListening, setIsListening] = useState(false);
            const [isSpeaking, setIsSpeaking] = useState(false);
            const [transcriptLog, setTranscriptLog] = useState("");
            const [assistantMessage, setAssistantMessage] = useState("اضغط على المايك لبدء المحادثة...");
            const [convStep, setConvStep] = useState('idle');
            
            const recognitionRef = useRef(null);
            const scrollContainerRef = useRef(null); // To auto-scroll history

            // Load & Save History
            useEffect(() => {
                const saved = localStorage.getItem('balootProHistoryV4');
                if (saved) {
                    try { setHistory(JSON.parse(saved)); } catch (e) {}
                }
            }, []);

            useEffect(() => {
                localStorage.setItem('balootProHistoryV4', JSON.stringify(history));
            }, [history]);

            // Setup Voice Recognition
            useEffect(() => {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (SpeechRecognition) {
                    const recognition = new SpeechRecognition();
                    recognition.continuous = false;
                    recognition.interimResults = false;
                    recognition.lang = 'ar-SA'; 
                    
                    recognition.onstart = () => setIsListening(true);
                    
                    recognition.onresult = (event) => {
                        const transcript = event.results[0][0].transcript;
                        setTranscriptLog(transcript);
                        handleConversationalStep(transcript);
                    };
                    
                    recognition.onerror = () => {
                        setIsListening(false);
                        if (convStep !== 'idle') {
                            speakAndListen("لم أسمعك بوضوح. هل يمكنك الإعادة؟", convStep);
                        }
                    };
                    
                    recognition.onend = () => setIsListening(false);
                    recognitionRef.current = recognition;
                }
            }, [form, convStep]);

            // Text-to-Speech Engine
            const speakAndListen = (text, nextStep) => {
                window.speechSynthesis.cancel();
                setAssistantMessage(text);
                setConvStep(nextStep);
                
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ar-SA';
                utterance.rate = 1.1; 
                
                utterance.onstart = () => setIsSpeaking(true);
                utterance.onend = () => {
                    setIsSpeaking(false);
                    if (nextStep !== 'idle' && nextStep !== 'done' && recognitionRef.current) {
                        try { recognitionRef.current.start(); } catch(e) {}
                    }
                };
                
                window.speechSynthesis.speak(utterance);
            };

            const handlePointsChange = (team, value) => {
                const val = parseInt(value) || 0;
                const max = form.type === 'sun' ? 26 : 16;
                if (value === '') {
                    setForm(prev => ({ ...prev, pointsLana: '', pointsLahoma: '' }));
                    return;
                }
                if (val > max) return;
                if (team === 'lana') setForm(prev => ({ ...prev, pointsLana: val, pointsLahoma: max - val }));
                else setForm(prev => ({ ...prev, pointsLahoma: val, pointsLana: max - val }));
            };

            const handleTypeChange = (type) => setForm(prev => ({ ...prev, type, pointsLana: '', pointsLahoma: '' }));

            // Conversational NLP State Machine
            const handleConversationalStep = (transcript) => {
                let text = transcript.replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).toLowerCase();
                let updates = { ...form };

                if (convStep === 'type') {
                    if (text.includes('صن') || text.includes('سن')) {
                        updates.type = 'sun';
                        setForm(updates);
                        speakAndListen("صن. مين المشتري؟", 'buyer');
                    } else if (text.includes('حكم')) {
                        updates.type = 'hokom';
                        setForm(updates);
                        speakAndListen("حكم. مين المشتري؟", 'buyer');
                    } else {
                        speakAndListen("عفواً، اللعب صن ولا حكم؟", 'type');
                    }
                } 
                else if (convStep === 'buyer') {
                    if (text.includes('لنا') || text.includes('احنا')) {
                        updates.buyer = 'lana';
                        setForm(updates);
                        speakAndListen("لنا. هل فيه مشاريع؟", 'projects');
                    } else if (text.includes('لهم') || text.includes('اشتروا')) {
                        updates.buyer = 'lahoma';
                        setForm(updates);
                        speakAndListen("لهم. هل فيه مشاريع؟", 'projects');
                    } else {
                        speakAndListen("مين المشتري؟", 'buyer');
                    }
                }
                else if (convStep === 'projects') {
                    if (text.includes('بدون') || text.includes('لا') || text.includes('مافيه')) {
                        speakAndListen("بدون مشاريع. كم الأبناط؟", 'points');
                        return;
                    }
                    
                    let foundProjects = false;
                    if (text.includes('سرا') || text.includes('سرى')) {
                        if (updates.buyer === 'lana') updates.projLana += 2; else updates.projLahoma += 2;
                        foundProjects = true;
                    }
                    if (text.includes('خمسين')) {
                        if (updates.buyer === 'lana') updates.projLana += 5; else updates.projLahoma += 5;
                        foundProjects = true;
                    }
                    if (text.includes('ميه') || text.includes('مية')) {
                        if (updates.buyer === 'lana') updates.projLana += 10; else updates.projLahoma += 10;
                        foundProjects = true;
                    }
                    
                    setForm(updates);
                    if (foundProjects) {
                        speakAndListen("سجلت المشاريع. كم الأبناط؟", 'points');
                    } else {
                        speakAndListen("لم أفهم المشاريع. يمكنك إدخالها يدوياً أو قل الأبناط.", 'points');
                    }
                }
                else if (convStep === 'points') {
                    const words = {
                        "صفر":0,"واحد":1,"اثنين":2,"ثلاثه":3,"ثلاثة":3,"اربع":4,"اربعة":4,"اربعه":4,"خمسه":5,"خمسة":5,
                        "سته":6,"ستة":6,"سبعه":7,"سبعة":7,"ثمانيه":8,"ثمانية":8,"تسعه":9,"تسعة":9,"عشره":10,"عشرة":10,
                        "احداعش":11,"اثناعش":12,"ثلاثطعش":13,"اربعطعش":14,"خمسطعش":15,"ستطعش":16,"سبعطعش":17,
                        "ثمانطعش":18,"تسعطعش":19,"عشرين":20,"واحد وعشرين":21,"اثنين وعشرين":22,"ثلاثه وعشرين":23,
                        "اربعة وعشرين":24,"خمسة وعشرين":25,"ستة وعشرين":26
                    };

                    let foundNumber = null;
                    const matches = text.match(/\d+/);
                    if (matches) foundNumber = parseInt(matches[0], 10);
                    else {
                        for (let w in words) {
                            if (text.includes(w)) { foundNumber = words[w]; break; }
                        }
                    }

                    if (foundNumber !== null) {
                        const max = updates.type === 'sun' ? 26 : 16;
                        if (foundNumber <= max) {
                            if (text.includes('لهم') && !text.includes('لنا')) {
                                updates.pointsLahoma = foundNumber;
                                updates.pointsLana = max - foundNumber;
                            } else {
                                updates.pointsLana = foundNumber;
                                updates.pointsLahoma = max - foundNumber;
                            }
                            setForm(updates);
                            speakAndListen("تم. راجع النتيجة ثم اضغط اعتماد.", 'done');
                        } else {
                            speakAndListen("الرقم أكبر من المسموح. كم الأبناط؟", 'points');
                        }
                    } else {
                        speakAndListen("لم أسمع رقماً. كم الأبناط؟", 'points');
                    }
                }
            };

            const startConversation = () => {
                if (!recognitionRef.current) return alert("المتصفح لا يدعم التعرف على الصوت.");
                setForm({ type: 'sun', buyer: 'lana', projLana: 0, projLahoma: 0, pointsLana: '', pointsLahoma: '' });
                setTranscriptLog("");
                speakAndListen("نوع اللعب صن ولا حكم؟", 'type');
            };

            const stopConversation = () => {
                window.speechSynthesis.cancel();
                if (recognitionRef.current) recognitionRef.current.stop();
                setConvStep('idle');
                setAssistantMessage("تم إيقاف المساعد الصوتي.");
            };

            const calculateResults = () => {
                let baseLana = parseInt(form.pointsLana) || 0;
                let baseLahoma = parseInt(form.pointsLahoma) || 0;
                let maxPts = form.type === 'sun' ? 26 : 16;
                let kabootPts = form.type === 'sun' ? 44 : 26;
                let totLana = baseLana + form.projLana;
                let totLahoma = baseLahoma + form.projLahoma;
                let isLoss = false;
                let lossMessage = "";

                if (baseLana === maxPts) {
                    totLana = kabootPts + form.projLana + form.projLahoma;
                    totLahoma = 0;
                    lossMessage = "كبوت لنا! 🔥";
                } else if (baseLahoma === maxPts) {
                    totLahoma = kabootPts + form.projLana + form.projLahoma;
                    totLana = 0;
                    lossMessage = "كبوت لهم! 💀";
                } else {
                    if (form.buyer === 'lana' && totLana <= totLahoma && (baseLana + baseLahoma === maxPts)) {
                        isLoss = true;
                        totLahoma = maxPts + form.projLana + form.projLahoma;
                        totLana = 0;
                        lossMessage = "خسارة علينا! (سقطنا) 💔";
                    } else if (form.buyer === 'lahoma' && totLahoma <= totLana && (baseLana + baseLahoma === maxPts)) {
                        isLoss = true;
                        totLana = maxPts + form.projLana + form.projLahoma;
                        totLahoma = 0;
                        lossMessage = "خسارة عليهم! (طيحناهم) 🏆";
                    }
                }
                return { totLana, totLahoma, isLoss, lossMessage, ready: (baseLana + baseLahoma === maxPts) };
            };

            const submitRound = () => {
                const results = calculateResults();
                if (!results.ready) return alert("الرجاء إدخال الأبناط بشكل صحيح لتكتمل الجولة.");
                
                setHistory([{ id: Date.now(), lana: results.totLana, lahoma: results.totLahoma, details: form.type === 'sun' ? 'صن' : 'حكم' }, ...history]);
                setIsModalOpen(false);
                stopConversation();
            };

            const resetGame = () => { if (window.confirm("تصفير النتيجة والبدء من جديد؟")) setHistory([]); };

            const totalLana = history.reduce((acc, curr) => acc + curr.lana, 0);
            const totalLahoma = history.reduce((acc, curr) => acc + curr.lahoma, 0);
            const preview = calculateResults();

            return (
                <div className="w-full max-w-md mx-auto h-[100dvh] flex flex-col relative overflow-hidden bg-[#0f172a]">
                    
                    {/* Header Area */}
                    <div className="px-5 pt-6 pb-4 shrink-0 flex flex-col z-10">
                        <div className="flex justify-between items-center mb-5">
                            <button onClick={resetGame} className="text-slate-400 hover:text-white p-2 rounded-full hover:bg-slate-800 transition">
                                <i className="fa-solid fa-rotate-right text-lg"></i>
                            </button>
                            <h1 className="text-2xl font-black tracking-wider gold-text">بلوت برو</h1>
                            <button onClick={() => history.length > 0 && setHistory(history.slice(1))} className={`p-2 rounded-full transition ${history.length === 0 ? 'text-slate-600' : 'text-slate-400 hover:text-white hover:bg-slate-800'}`}>
                                <i className="fa-solid fa-arrow-rotate-left text-lg"></i>
                            </button>
                        </div>

                        {/* Progress Bar */}
                        <div className="w-full bg-slate-800/80 rounded-full h-1.5 flex overflow-hidden">
                            <div className="bg-emerald-500 h-full progress-bar" style={{width: `${Math.min((totalLana/SakahLimit)*100, 100)}%`}}></div>
                            <div className="flex-1"></div>
                            <div className="bg-rose-500 h-full progress-bar" style={{width: `${Math.min((totalLahoma/SakahLimit)*100, 100)}%`}}></div>
                        </div>
                    </div>

                    {/* Main Score Cards */}
                    <div className="px-5 pb-5 shrink-0 z-10">
                        <div className="grid grid-cols-2 gap-4">
                            <div className="glass-panel rounded-2xl p-5 flex flex-col items-center justify-center relative overflow-hidden">
                                {totalLana >= SakahLimit && <div className="absolute top-0 left-0 w-full h-1 bg-emerald-400"></div>}
                                <span className="text-sm font-bold text-slate-400 mb-1">لنا (Us)</span>
                                <span className="text-5xl font-black text-white">{totalLana}</span>
                            </div>
                            <div className="glass-panel rounded-2xl p-5 flex flex-col items-center justify-center relative overflow-hidden">
                                {totalLahoma >= SakahLimit && <div className="absolute top-0 left-0 w-full h-1 bg-rose-400"></div>}
                                <span className="text-sm font-bold text-slate-400 mb-1">لهم (Them)</span>
                                <span className="text-5xl font-black text-white">{totalLahoma}</span>
                            </div>
                        </div>
                    </div>

                    {/* Floating Action Button */}
                    <div className="px-5 pb-5 shrink-0 z-10">
                        <button onClick={() => { setIsModalOpen(true); setTranscriptLog(""); }} 
                            className="w-full py-3.5 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold text-lg btn-press shadow-lg shadow-blue-900/30 flex items-center justify-center">
                            <i className="fa-solid fa-plus mr-2"></i> تسجيل جولة
                        </button>
                    </div>

                    {/* Ledger/History Area */}
                    <div className="flex-1 glass-panel rounded-t-3xl overflow-hidden flex flex-col shadow-[0_-10px_40px_rgba(0,0,0,0.3)] z-0 mx-2 mb-0">
                        <div className="grid grid-cols-4 text-center bg-slate-900/80 p-3 font-bold text-slate-400 text-xs border-b border-slate-700/50 shrink-0">
                            <div>لنا</div><div>لعب</div><div>الفرق</div><div>لهم</div>
                        </div>
                        <div className="flex-1 overflow-y-auto p-2" ref={scrollContainerRef}>
                            {history.length === 0 ? (
                                <div className="h-full flex flex-col items-center justify-center text-slate-500 opacity-50 space-y-3">
                                    <i className="fa-solid fa-spade text-4xl"></i>
                                    <span className="text-sm font-medium">ابدأ اللعب لتسجيل الجولات</span>
                                </div>
                            ) : (
                                history.map((round) => (
                                    <div key={round.id} className="grid grid-cols-4 text-center p-2.5 border-b border-slate-700/30 hover:bg-slate-800/30 transition items-center">
                                        <div className="text-emerald-400 font-bold text-base">{round.lana > 0 ? round.lana : '-'}</div>
                                        <div className="text-slate-400 text-[10px] font-bold bg-slate-800/80 px-2 py-1 rounded w-max mx-auto">{round.details}</div>
                                        <div className="text-slate-500 text-xs">{Math.abs(round.lana - round.lahoma) > 0 ? Math.abs(round.lana - round.lahoma) : '-'}</div>
                                        <div className="text-rose-400 font-bold text-base">{round.lahoma > 0 ? round.lahoma : '-'}</div>
                                    </div>
                                ))
                            )}
                        </div>
                    </div>

                    {/* Bottom Sheet Modal */}
                    {isModalOpen && (
                        <div className="fixed inset-0 z-50 flex flex-col justify-end bg-slate-950/80 backdrop-blur-sm sm:items-center sm:justify-center">
                            {/* Backdrop click to close */}
                            <div className="absolute inset-0 z-0" onClick={() => {setIsModalOpen(false); stopConversation();}}></div>
                            
                            <div className="relative z-10 w-full max-w-md bg-slate-900 rounded-t-3xl sm:rounded-3xl flex flex-col max-h-[92dvh] animate-slide-up shadow-2xl border-t border-slate-700/50 sm:border">
                                
                                {/* Modal Header (Sticky) */}
                                <div className="flex justify-between items-center p-5 border-b border-slate-800/80 shrink-0 bg-slate-900 rounded-t-3xl">
                                    <h3 className="text-xl font-bold text-white tracking-wide">تسجيل النتيجة</h3>
                                    <button onClick={() => {setIsModalOpen(false); stopConversation();}} className="text-slate-400 hover:text-white bg-slate-800 rounded-full w-8 h-8 flex items-center justify-center transition btn-press">
                                        <i className="fa-solid fa-xmark"></i>
                                    </button>
                                </div>

                                {/* Modal Body (Scrollable) */}
                                <div className="flex-1 overflow-y-auto p-5 space-y-6">
                                    
                                    {/* Compact Voice Assistant Panel */}
                                    <div className="bg-slate-800/50 rounded-2xl p-3 border border-blue-900/40 relative overflow-hidden flex flex-col gap-2">
                                        {isSpeaking && <div className="absolute top-0 left-0 w-full h-0.5 bg-blue-500 animate-pulse"></div>}
                                        {isListening && <div className="absolute top-0 left-0 w-full h-0.5 bg-emerald-500 animate-pulse"></div>}
                                        
                                        <div className="flex items-center gap-3">
                                            <button onClick={convStep === 'idle' ? startConversation : stopConversation} 
                                                className={`shrink-0 w-12 h-12 rounded-full flex items-center justify-center text-xl transition-colors btn-press ${convStep !== 'idle' ? 'bg-rose-600 text-white shadow-[0_0_10px_#e11d48]' : 'bg-blue-600 text-white shadow-[0_0_10px_#2563eb]'}`}>
                                                <i className={`fa-solid ${convStep !== 'idle' ? 'fa-stop' : 'fa-microphone'}`}></i>
                                            </button>
                                            <div className="flex-1 min-w-0">
                                                <p className="text-[10px] text-blue-400 mb-0.5 font-bold uppercase tracking-wider">المساعد الصوتي</p>
                                                <p className="text-sm text-slate-200 font-medium truncate">{assistantMessage}</p>
                                            </div>
                                        </div>
                                        {transcriptLog && (
                                            <div className="bg-black/40 rounded-lg px-3 py-2 border border-slate-700/50">
                                                <span className="text-emerald-400 text-xs font-mono">{transcriptLog}</span>
                                            </div>
                                        )}
                                    </div>

                                    {/* Type & Buyer Toggles */}
                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="space-y-1.5">
                                            <label className="text-xs text-slate-400 font-bold ml-1">اللعب:</label>
                                            <div className="flex bg-slate-950/50 rounded-xl p-1 border border-slate-800">
                                                <button onClick={() => handleTypeChange('sun')} className={`flex-1 py-2 rounded-lg font-bold text-sm transition-all ${form.type === 'sun' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-500'}`}>صن</button>
                                                <button onClick={() => handleTypeChange('hokom')} className={`flex-1 py-2 rounded-lg font-bold text-sm transition-all ${form.type === 'hokom' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-500'}`}>حكم</button>
                                            </div>
                                        </div>
                                        <div className="space-y-1.5">
                                            <label className="text-xs text-slate-400 font-bold ml-1">المشتري:</label>
                                            <div className="flex bg-slate-950/50 rounded-xl p-1 border border-slate-800">
                                                <button onClick={() => setForm({...form, buyer: 'lana'})} className={`flex-1 py-2 rounded-lg font-bold text-sm transition-all ${form.buyer === 'lana' ? 'bg-emerald-600 text-white shadow-md' : 'text-slate-500'}`}>لنا</button>
                                                <button onClick={() => setForm({...form, buyer: 'lahoma'})} className={`flex-1 py-2 rounded-lg font-bold text-sm transition-all ${form.buyer === 'lahoma' ? 'bg-rose-600 text-white shadow-md' : 'text-slate-500'}`}>لهم</button>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Projects Section (Responsive Grid) */}
                                    <div className="space-y-4">
                                        {/* Lana Projects */}
                                        <div>
                                            <div className="flex items-center justify-between mb-2 ml-1">
                                                <label className="text-xs text-slate-400 font-bold">مشاريعنا (لنا): {form.projLana > 0 && <span className="text-emerald-400 ml-1">+{form.projLana}</span>}</label>
                                            </div>
                                            <div className="flex flex-wrap items-center gap-2">
                                                {[ {l:'سرا',v:2}, {l:'خمسين',v:5}, {l:'مية',v:10}, {l:'اربعمية',v:40}, {l:'بلوت',v:2} ].map(p => (
                                                    <button key={'lana'+p.l} onClick={() => setForm({...form, projLana: form.projLana === p.v ? 0 : form.projLana + p.v})} 
                                                        className={`chip px-3 py-1.5 rounded-lg text-xs font-bold border border-slate-700 bg-slate-800 text-slate-300 ${form.projLana >= p.v ? 'active' : ''}`}>{p.l}</button>
                                                ))}
                                                {form.projLana > 0 && (
                                                    <button onClick={() => setForm({...form, projLana: 0})} className="px-2.5 py-1.5 rounded-lg text-xs font-bold bg-rose-500/20 text-rose-400 btn-press"><i className="fa-solid fa-xmark"></i></button>
                                                )}
                                            </div>
                                        </div>

                                        {/* Lahoma Projects */}
                                        <div>
                                            <div className="flex items-center justify-between mb-2 ml-1">
                                                <label className="text-xs text-slate-400 font-bold">مشاريعهم (لهم): {form.projLahoma > 0 && <span className="text-rose-400 ml-1">+{form.projLahoma}</span>}</label>
                                            </div>
                                            <div className="flex flex-wrap items-center gap-2">
                                                {[ {l:'سرا',v:2}, {l:'خمسين',v:5}, {l:'مية',v:10}, {l:'اربعمية',v:40}, {l:'بلوت',v:2} ].map(p => (
                                                    <button key={'lahoma'+p.l} onClick={() => setForm({...form, projLahoma: form.projLahoma === p.v ? 0 : form.projLahoma + p.v})} 
                                                        className={`chip px-3 py-1.5 rounded-lg text-xs font-bold border border-slate-700 bg-slate-800 text-slate-300 ${form.projLahoma >= p.v ? 'active' : ''}`}>{p.l}</button>
                                                ))}
                                                {form.projLahoma > 0 && (
                                                    <button onClick={() => setForm({...form, projLahoma: 0})} className="px-2.5 py-1.5 rounded-lg text-xs font-bold bg-rose-500/20 text-rose-400 btn-press"><i className="fa-solid fa-xmark"></i></button>
                                                )}
                                            </div>
                                        </div>
                                    </div>

                                    {/* Points Input */}
                                    <div>
                                        <label className="text-xs text-slate-400 font-bold mb-2 block ml-1">الأبناط (المجموع {form.type === 'sun' ? 26 : 16}):</label>
                                        <div className="grid grid-cols-2 gap-3">
                                            <div className="relative">
                                                <span className="absolute right-3 top-1/2 -translate-y-1/2 text-xs text-slate-500 font-bold">لنا</span>
                                                <input type="number" value={form.pointsLana} onChange={(e) => handlePointsChange('lana', e.target.value)}
                                                    className="w-full bg-slate-950/50 border border-slate-700 rounded-xl py-3 pr-10 pl-3 text-xl font-black text-center text-white focus:outline-none focus:border-emerald-500 transition-colors" placeholder="0" />
                                            </div>
                                            <div className="relative">
                                                <span className="absolute right-3 top-1/2 -translate-y-1/2 text-xs text-slate-500 font-bold">لهم</span>
                                                <input type="number" value={form.pointsLahoma} onChange={(e) => handlePointsChange('lahoma', e.target.value)}
                                                    className="w-full bg-slate-950/50 border border-slate-700 rounded-xl py-3 pr-10 pl-3 text-xl font-black text-center text-white focus:outline-none focus:border-rose-500 transition-colors" placeholder="0" />
                                            </div>
                                        </div>
                                    </div>
                                    
                                    {/* Final Review Display inline */}
                                    <div className="pt-2">
                                        {preview.ready ? (
                                            <div className="flex flex-col items-center justify-center p-3 bg-slate-800/30 rounded-xl border border-slate-700/50">
                                                <div className="flex justify-center items-center gap-4 text-xl font-black">
                                                    <span className={preview.totLana > preview.totLahoma ? "text-emerald-400" : "text-white"}>{preview.totLana}</span>
                                                    <span className="text-slate-600">-</span>
                                                    <span className={preview.totLahoma > preview.totLana ? "text-rose-400" : "text-white"}>{preview.totLahoma}</span>
                                                </div>
                                                {preview.lossMessage && <div className="text-rose-400 text-xs font-bold mt-1 animate-pulse">{preview.lossMessage}</div>}
                                            </div>
                                        ) : (
                                            <div className="text-center text-slate-500 text-xs py-3">أكمل إدخال الأبناط لحساب النتيجة</div>
                                        )}
                                    </div>
                                </div>

                                {/* Modal Footer (Sticky Bottom) */}
                                <div className="p-5 border-t border-slate-800/80 bg-slate-900 shrink-0 pb-8 sm:pb-5">
                                    <button onClick={submitRound} disabled={!preview.ready} 
                                        className={`w-full py-3.5 rounded-xl font-bold text-lg transition-all btn-press flex items-center justify-center gap-2
                                        ${preview.ready ? 'bg-emerald-600 hover:bg-emerald-500 text-white shadow-[0_0_15px_rgba(16,185,129,0.3)]' : 'bg-slate-800 text-slate-500 opacity-70 cursor-not-allowed'}`}>
                                        <i className="fa-solid fa-check"></i> اعتماد النتيجة
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
